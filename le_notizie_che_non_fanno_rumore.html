<div id="presentation-bar" hidden></div><div id="class-bar" hidden></div><div id="projectbar" class="projectbar"></div><p class="storage-note notice" id="storage-note" hidden></p>
<div id="view"></div><footer id="app-footer" class="app-foot">Laboratorio di educazione ai media</footer>
</main>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';

// Impaginazione, lettura e stampa. Questa sezione è inclusa anche nell'HTML di sola lettura.
function lettura() {
  const $ = (selector, scope = document) => scope.querySelector(selector);
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs)) {
      if (value === null || value === undefined || value === false) continue;
      if (name.startsWith('on') && typeof value === 'function') node.addEventListener(name.slice(2), value);
      else if (name === 'class') node.className = value;
      else if (name === 'value') node.value = value;
      else node.setAttribute(name, value === true ? '' : value);
    }
    node.append(...children.flat(Infinity).filter(value => value !== null && value !== undefined && value !== false && value !== 0));
    return node;
  }
  const btn = (title, action, variant = '', attrs = {}) => el('button', {type:'button', class:'btn ' + variant, onclick:action, ...attrs}, title);
  const safeURL = value => {
    if (!value || typeof value !== 'string') return '';
    try {
      const url = new URL(value);
      return url.protocol === 'https:' && url.hostname && !url.username && !url.password ? url.href : '';
    } catch { return ''; }
  };
  const external = (url, title) => safeURL(url)
    ? el('a', {href:safeURL(url), target:'_blank', rel:'noopener noreferrer', referrerpolicy:'no-referrer'}, title)
    : null;
  const dateLabel = value => /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value.split('-').reverse().join('/') : '';
  const editionClass = edition => edition.classLabel ?? '2X';
  function photoAttrs(photo) {
    return {src:photo.src, alt:photo.alt || '', width:photo.width || null, height:photo.height || null,
      style:photo.width && photo.height ? 'aspect-ratio:' + photo.width + '/' + photo.height : null};
  }
  const articlePhoto = (article, index) => article.images[index] || article.images[0];
  const readingSpreads = [['auto','Automatica'],['single','Una pagina'],['double','Due pagine affiancate']];
  const editorialSections = {
    opening:'Apertura',editorial:'Articolo di fondo',sidebar:'Articolo di spalla',middle:'Taglio medio',brief:'Breve',closing:'Taglio basso'
  };
  const layoutModels = {
    classic:{name:'Quotidiano classico',columns:3,opening:'split',sections:['opening','sidebar','middle','brief','brief','closing']},
    visual:{name:'Quotidiano visivo',columns:3,opening:'full',sections:['opening','sidebar','middle','brief','brief','closing']},
    essential:{name:'Quotidiano essenziale',columns:2,opening:'full',sections:['opening','middle','brief','brief','closing']},
    broadsheet:{name:'Quotidiano di approfondimento',columns:4,opening:'split',sections:['opening','sidebar','editorial','middle','brief','closing']}
  };
  // Ogni colonna editoriale comprende quattro unità per gli aggiustamenti a mano.
  const columnUnits = 4;
  const defaultColumns = 3;
  const columnCount = edition => Number.isInteger(edition.columns) && edition.columns >= 1 && edition.columns <= 6 ? edition.columns : defaultColumns;
  const unitsFor = edition => columnCount(edition) * columnUnits;
  const minimumWidth = columnUnits;
  const minimumHeight = 4;
  const maximumHeight = 19;
  const clamp = (number,min,max) => Math.max(min,Math.min(max,number));
  const photoBounds = {width:[25,100],height:[30,200]};
  function photoSize(value) {
    return Object.fromEntries(Object.entries(photoBounds).map(([axis,[min,max]]) => [axis,
      Number.isInteger(value?.[axis]) ? clamp(value[axis],min,max) : 100]));
  }
  function samePhotoSize(a,b) {
    const first = photoSize(a), second = photoSize(b);
    return first.width === second.width && first.height === second.height;
  }
  function photoSizeStyle(value) {
    const {width,height} = photoSize(value);
    return '--photo-width:'+width+'%;--photo-height:'+height/100;
  }
  const frameSides = {left:'sinistra',right:'destra',top:'alto',bottom:'basso'};
  const intersects = (a,b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  function normalizeFrame(value,units = defaultColumns*columnUnits) {
    if (!value || !Number.isInteger(value.w) || !Number.isInteger(value.h)) return null;
    const w = clamp(value.w,minimumWidth,units);
    return {w,h:clamp(value.h,minimumHeight,maximumHeight),anchor:value.anchor === true,autoSize:value.autoSize === true,
      x:Number.isInteger(value.x) ? clamp(value.x,0,units-1) : null,
      y:Number.isInteger(value.y) ? clamp(value.y,0,200) : null};
  }
  function fitBelow(frame, placed) {
    let conflicts = placed.filter(other => intersects(frame,other));
    while (conflicts.length) {
      frame = {...frame,y:Math.max(...conflicts.map(other => other.y + other.h))};
      conflicts = placed.filter(other => intersects(frame,other));
    }
    return frame;
  }
  function sectionPlan(edition) {
    const taken = new Set();
    const roles = new Map();
    for (const {id,section} of edition.layout) {
      if (!Object.hasOwn(editorialSections,section) || taken.has(section)) continue;
      roles.set(id,section);
      if (section !== 'brief') taken.add(section);
    }
    const next = [...(layoutModels[edition.model] || layoutModels.classic).sections];
    for (const {id} of edition.layout) {
      if (roles.has(id)) continue;
      while (taken.has(next[0])) next.shift();
      const section = next.shift() ?? 'brief';
      roles.set(id,section);
      if (section !== 'brief') taken.add(section);
    }
    return roles;
  }
  function framePlan(edition) {
    const units = unitsFor(edition);
    const photos = new Set(edition.articles.filter(article => article.images.length).map(article => article.id));
    const preferred = [];
    const changes = new Map(edition.layout.map(item => [item.id,normalizeFrame(item.frame,units)]));
    const model = layoutModels[edition.model] || layoutModels.classic;
    const sections = sectionPlan(edition);
    const topEditorial = edition.model === 'broadsheet' && units >= 3*columnUnits && [...sections.values()].includes('editorial');
    const priority = ['opening','sidebar','editorial','middle','brief','closing'];
    const ordered = [...edition.layout].sort((a,b) => priority.indexOf(sections.get(a.id))-priority.indexOf(sections.get(b.id)));
    for (const item of ordered) {
      const section = sections.get(item.id);
      const main = section === 'opening';
      const saved = changes.get(item.id);
      const manual = saved && !saved.autoSize ? saved : null;
      const withPhoto = item.showPhoto && photos.has(item.id);
      const openingWidth = model.opening === 'full' || units === columnUnits ? units : units-(topEditorial ? 2 : 1)*columnUnits;
      const secondaryWidth = section === 'closing' ? 2*columnUnits : columnUnits;
      const natural = main ? (item.size === 'ampio' ? units : item.size === 'ridotto' ? openingWidth-2 : openingWidth)
        : item.size === 'ampio' ? 2*columnUnits : item.size === 'ridotto' ? columnUnits : secondaryWidth;
      const w = manual?.w ?? clamp(natural,minimumWidth,units);
      const h = manual?.h ?? (main ? (edition.model === 'visual' ? 15 : edition.model === 'essential' ? 12 : 13) :
        (withPhoto ? 10 : 7) + (item.size === 'ampio' ? 1 : item.size === 'ridotto' ? -1 : 0));
      const lead = preferred[0]?.section === 'opening' ? preferred[0] : null;
      const sidebar = section === 'sidebar';
      const editorial = section === 'editorial';
      const edge = units-w;
      const x = main && topEditorial ? Math.min(columnUnits,edge) : sidebar || item.align === 'right' && !main && !editorial ? edge : 0;
      const onTop = main || sidebar && (!lead || lead.x+lead.w <= edge) || editorial && topEditorial && (!lead || w <= lead.x);
      const y = section === 'closing' ? Math.max(0,...preferred.map(frame => frame.y+frame.h)) :
        onTop ? 0 : lead?.h ?? 0;
      const base = {x,y,w,h,id:item.id,section,units};
      const candidates = main || sidebar || section === 'editorial' ? [x] : nearbyColumns(base,columnUnits);
      preferred.push(bestPlacement(base,candidates,preferred));
    }
    const anchor = preferred.find(frame => changes.get(frame.id)?.anchor);
    const inLayoutOrder = frames => {
      const byId = new Map(frames.map(frame => [frame.id,frame]));
      return edition.layout.map(item => byId.get(item.id));
    };
    if (!anchor && !preferred.some(frame => changes.get(frame.id)?.x != null)) return inLayoutOrder(preferred);
    const placed = [];
    const order = anchor ? [anchor,...preferred.filter(item => item !== anchor)] : preferred;
    for (const frame of order) {
      const saved = changes.get(frame.id);
      const original = {...frame,x:clamp(saved?.x ?? frame.x,0,units-frame.w),y:saved?.y ?? frame.y};
      const candidates = frame === anchor ? [original.x] : nearbyColumns(original);
      placed.push(bestPlacement(original,candidates,placed));
    }
    return inLayoutOrder(placed);
  }
  function nearbyColumns(frame,step = 1) {
    const last = frame.units-frame.w;
    const positions = Array.from({length:Math.floor(last/step)+1},(_,column) => column*step);
    return [...new Set([frame.x,...positions])]
      .sort((a,b) => Math.abs(a-frame.x)-Math.abs(b-frame.x));
  }
  function bestPlacement(frame,columns,placed) {
    return columns.map(x => fitBelow({...frame,x},placed)).reduce((a,b) => b.y < a.y ? b : a);
  }
  function adjustEdge(frame,side,steps) {
    let {x,y,w,h} = frame;
    const units = frame.units ?? defaultColumns*columnUnits;
    if (side === 'left') {
      const edge = clamp(x-steps,Math.max(0,x+w-units),x+w-minimumWidth);
      w += x-edge;
      x = edge;
    } else if (side === 'right') {
      w = clamp(w+steps,minimumWidth,units-x);
    } else if (side === 'top') {
      const edge = clamp(y-steps,Math.max(0,y+h-maximumHeight),y+h-minimumHeight);
      h += y-edge;
      y = edge;
    } else if (side === 'bottom') {
      h = clamp(h+steps,minimumHeight,maximumHeight);
    }
    return {...frame,x,y,w,h};
  }
  const frameChanged = (old,next) => ['x','y','w','h'].some(key => old[key] !== next[key]);
  function resizeFrame(edition,id,side,steps) {
    const current = framePlan(edition).find(item => item.id === id);
    if (!current) return false;
    const changed = adjustEdge(current,side,steps);
    if (!frameChanged(current,changed)) return false;
    for (const item of edition.layout) {
      if (item.id === id) item.frame = {...normalizeFrame(changed,changed.units),anchor:true};
      else if (item.frame?.anchor) item.frame = {...item.frame,anchor:false};
    }
    return true;
  }
  function resetFramePositions(edition) {
    for (const item of edition.layout) {
      if (item.frame) item.frame = item.frame.autoSize ? null : {...item.frame,x:null,y:null,anchor:false};
    }
  }
  function changeColumns(edition,count) {
    const previous = unitsFor(edition);
    edition.columns = count;
    const units = unitsFor(edition);
    for (const item of edition.layout) {
      const current = normalizeFrame(item.frame,previous);
      item.frame = current && !current.autoSize ? {...current,x:null,y:null,anchor:false,
        w:clamp(Math.round(current.w*units/previous),minimumWidth,units)} : null;
    }
  }
  function moveIntoArea(edition,source,destination) {
    const order = [...edition.layout];
    const from = order.findIndex(item => item.id === source), to = order.findIndex(item => item.id === destination);
    if (from < 0 || to < 0 || from === to) return null;
    const slots = framePlan(edition);
    order.splice(to,0,order.splice(from,1)[0]);
    // Gli articoli fra origine e destinazione avanzano di un posto verso il riquadro liberato.
    // Al riquadro trascinato spetta l'area di arrivo quando la griglia risolve gli incastri.
    return order.map((item,index) => {
      const {x,y,w,h} = slots[index];
      const previous = normalizeFrame(item.frame,unitsFor(edition));
      return {...item,section:edition.layout[index].section ?? null,
        frame:{w:previous?.w ?? w,h:previous?.h ?? h,x,y,autoSize:!previous || previous.autoSize,anchor:item.id === source}};
    });
  }
  function frameStyle(frame) {
    const percent = frame.units === minimumWidth ? 100 : 55+(frame.w-minimumWidth)*45/(frame.units-minimumWidth);
    const room = frame.units-frame.w;
    const offset = room ? (100-percent) * frame.x / room : 0;
    return 'grid-column:'+(frame.x+1)+'/span '+frame.w+';grid-row:'+(frame.y+1)+'/span '+frame.h+
      ';--frame-rows:'+frame.h+';--photo-rows:'+Math.max(2,Math.round(frame.h*.34))+
      ';--phone-width:'+percent+'%;--phone-offset:'+offset+'%';
  }
  function resizeHandle(side,frame,cell,apply) {
    const horizontal = side === 'left' || side === 'right';
    const direction = side === 'top' || side === 'left' ? -1 : 1;
    const label = 'Ridimensiona dal lato ' + frameSides[side];
    const handle = btn(label,() => apply(side,frameChanged(frame,adjustEdge(frame,side,1)) ? 1 : -1,side),
      'frame-handle frame-handle-' + side,{'aria-label':label,title:label + ' · trascina o usa le frecce'});
    let gesture;
    handle.addEventListener('dragstart',event => event.preventDefault());
    handle.addEventListener('pointerdown',event => {
      if (event.button !== 0) return;
      event.preventDefault();
      const grid = cell.parentElement;
      const styles = getComputedStyle(grid);
      const columnGap = parseFloat(styles.columnGap) || 0;
      const rowGap = parseFloat(styles.rowGap) || 0;
      const mobile = styles.display !== 'grid';
      const step = horizontal ? (grid.clientWidth + columnGap) / (mobile ? (frame.units-minimumWidth)/.45 || 1 : frame.units)
        : Math.max(18,cell.offsetHeight / frame.h + rowGap);
      const ghost = el('div',{class:'frame-resize-outline','aria-hidden':'true'});
      cell.append(ghost);
      gesture = {at:horizontal ? event.clientX : event.clientY,step,ghost,id:event.pointerId,units:0};
      handle.setPointerCapture(event.pointerId);
    });
    handle.addEventListener('pointermove',event => {
      if (gesture?.id !== event.pointerId) return;
      const distance = (horizontal ? event.clientX : event.clientY) - gesture.at;
      const next = adjustEdge(frame,side,Math.round(distance*direction/gesture.step));
      const units = horizontal ? next.w-frame.w : next.h-frame.h;
      gesture.units = units;
      gesture.ghost.style.setProperty(side,(-units*gesture.step)+'px');
    });
    const finish = event => {
      if (gesture?.id !== event.pointerId) return;
      const {ghost,units} = gesture;
      gesture = null;
      ghost.remove();
      if (event.type === 'pointerup' && units) apply(side,units);
    };
    for (const event of ['pointerup','pointercancel','lostpointercapture']) handle.addEventListener(event,finish);
    handle.addEventListener('keydown',event => {
      const keys = horizontal ? ['ArrowLeft','ArrowRight'] : ['ArrowUp','ArrowDown'];
      const index = keys.indexOf(event.key);
      if (index < 0) return;
      event.preventDefault();
      apply(side,(index ? 1 : -1)*direction,side);
    });
    return handle;
  }

  const copyBlocks = new WeakMap();
  const lockCoverFit = new WeakSet();
  function fitFront(front,map = new Map()) {
    if (!front?.isConnected || !front.clientWidth || lockCoverFit.has(front)) return map;
    for (const box of front.querySelectorAll('.front-copy')) {
      const copy = copyBlocks.get(box);
      if (!copy) continue;
      const {blocks,isArticle,articleId,link} = copy;
      const height = box.clientHeight;
      box.replaceChildren();
      const fits = node => {
        box.append(node);
        const fits = box.scrollHeight <= height + 1;
        node.remove();
        return fits;
      };
      let index = 0, offset = 0;
      if (height > 0) for (;index < blocks.length; index++) {
        const {tag,tokens} = blocks[index];
        const node = richNode(tag,tokens);
        if (fits(node)) {
          box.append(node);
          continue;
        }
        if (tag !== 'p') break;
        let low = 0, high = tokens.length;
        while (low < high) {
          const middle = Math.ceil((low+high)/2);
          if (fits(richNode(tag,tokens.slice(0,middle)))) low = middle;
          else high = middle-1;
        }
        offset = low;
        if (offset) box.append(richNode(tag,tokens.slice(0,offset)));
        break;
      }
      if (isArticle) {
        if (index || offset) map.set(articleId,{index,offset});
        if (link) link.textContent = index === blocks.length ? 'Fonti e dettagli all’interno' :
          index || offset ? 'Continua nelle pagine interne' : 'Leggi nelle pagine interne';
      }
    }
    return map;
  }
  function remainingBody(blocks,cut) {
    if (!cut) return blocks;
    const remaining = blocks.slice(cut.index);
    if (cut.offset && remaining.length) {
      remaining[0] = {...remaining[0],tokens:remaining[0].tokens.slice(cut.offset)};
    }
    return remaining;
  }
  function frontBody(article,cut) {
    if (!cut) return '';
    const blocks = richBody(article.text);
    const visible = blocks.slice(0,cut.index);
    if (cut.offset) visible.push({...blocks[cut.index],tokens:blocks[cut.index].tokens.slice(0,cut.offset)});
    return visible.map(({tag,tokens}) => (tag === 'h3' ? '## ' : '') + richRuns(tokens).map(({strong,value}) =>
      strong ? '**'+value+'**' : value).join('')).join('\n\n');
  }
  function measureCover(front,parent,width) {
    const probe = el('div',{class:'cover-measure','aria-hidden':'true',inert:true,style:'width:'+width+'px'},front);
    parent.append(probe);
    const cuts = fitFront(front);
    probe.remove();
    return cuts;
  }

  function frontPage(edition, options = {}) {
    const {onArticle,onSelect,editable=false,insertion,resize,selected,forPrint,coversOnly} = options;
    const canMove = editable && edition.layout.length > 1;
    const plan = new Map(framePlan(edition).map(frame => [frame.id,frame]));
    const grid = el('div', {class:'front-grid frame-grid'});
    const front = el('div', {class:'front frame-cover '+edition.model+(editable ? ' editable-cover' : ''),
      style:'--grid-units:'+unitsFor(edition),'data-columns':columnCount(edition)}, el('header', {class:'front-flag'},
      el('p', {class:'front-meta'}, [editionClass(edition),edition.issue,dateLabel(edition.date)].filter(Boolean).join(' · ') || 'Edizione senza data'),
      el('div', {class:'front-name'}, edition.name || 'Quotidiano senza titolo'),
      edition.motto && el('p', {class:'front-motto'}, edition.motto)), grid);
    const articles = new Map(edition.articles.map(article => [article.id, article]));
    [...edition.layout].sort((a,b) => plan.get(a.id).y-plan.get(b.id).y || plan.get(a.id).x-plan.get(b.id).x).forEach(item => {
      const article = articles.get(item.id);
      if (!article) return;
      const frame = plan.get(item.id);
      const position = frame.section === 'opening' ? 'lead' : frame.section === 'sidebar' ? 'side' : '';
      const size = {standard:'', ampio:'wide', ridotto:'compact'}[item.size];
      const align = !position && item.align === 'right' ? ' pos-right' : '';
      const heading = item.title || article.title;
      const summary = item.summary || article.summary;
      const photo = articlePhoto(article, item.photo);
      const open = onSelect || onArticle;
      const title = el('h3', {class:'front-title'}, open ? el('button', {type:'button', onclick:() => open(item.id), 'aria-pressed':onSelect ? String(selected === item.id) : null}, heading) : heading);
      const displayPhoto = item.showPhoto && photo;
      const picture = displayPhoto && el('figure', {class:'front-photo',style:photoSizeStyle(item.photoSize)},
        el('img', {...photoAttrs(photo), draggable:'false', style:'object-position:' + (item.cropX ?? 50) + '% ' + (item.cropY ?? 50) + '%'}),
        photo.caption && el('figcaption', {}, photo.caption));
      const cell = el('article', {class:['front-cell frame-cell', position, size, 'title-' + item.titleSize].filter(Boolean).join(' ') + align,
        style:frameStyle(frame), 'data-id':item.id, 'data-section':frame.section,
        'data-frame':[frame.x,frame.y,frame.w,frame.h].join(','), 'data-selected':onSelect ? String(item.id === selected) : null,
        'data-insertion':insertion === item.id ? 'true' : null,'data-editor':canMove || insertion ? 'true' : null,
        draggable:canMove ? 'true' : null});
      const category = !edition.hideCategories && article.categories.length ? article.categories.join(' · ') : '';
      const label = article.fiction ? 'Esempio inventato' : article.type === 'Notizia documentata' ? category : article.type;
      const tag = label && el('div', {class:'kicker'}, label);
      if (edition.model === 'visual' && frame.section === 'opening') cell.append(...[picture, tag, title].filter(Boolean));
      else cell.append(...[tag, title, picture].filter(Boolean));
      const mode = item.bodyMode || (item.showSummary ? 'summary' : 'title');
      const isArticle = mode === 'article';
      const display = isArticle ? article.text : mode === 'summary' ? summary : '';
      const link = isArticle && !coversOnly && (onArticle
        ? el('button',{type:'button',class:'front-continues',onclick:() => onArticle(item.id),'aria-label':'Continua a leggere: '+heading},'Continua nelle pagine interne')
        : el('p',{class:'front-continues'},'Continua nelle pagine interne'));
      if (display) {
        const copy = el('div',{class:'front-copy'});
        copyBlocks.set(copy,{blocks:richBody(display),isArticle,articleId:item.id,link});
        cell.append(copy);
        if (link) cell.append(link);
      }
      if (resize && selected === item.id) cell.append(...Object.keys(frameSides).map(side =>
        resizeHandle(side,frame,cell,(edge,steps,focus) => resize(item.id,edge,steps,focus))));
      if (forPrint && displayPhoto && photo.credit) cell.append(el('div', {class:'caption'}, photo.credit,
        photo.creditURL && ' · ', external(photo.creditURL, 'Fonte immagine'), photo.license && ' · ', external(photo.license, 'Licenza')));
      if (canMove) cell.append(el('button',{type:'button',class:'btn tile-grip',draggable:'false','data-move-handle':item.id,
        title:'Sposta il riquadro','aria-label':'Sposta '+heading,'aria-pressed':'false','aria-describedby':'move-layout-help'},
        el('span',{class:'grip-mark','aria-hidden':'true'})));
      grid.append(cell);
    });
    if (!grid.childElementCount) grid.append(el('p', {class:'empty', style:'grid-column:1/-1'}, 'La prima pagina è ancora vuota.'));
    const featured = edition.coverImage && articles.get(edition.coverImage.id);
    const chosen = featured && articlePhoto(featured, edition.coverImage.index);
    if (chosen && !edition.layout.some(item => item.id === featured.id && item.showPhoto && articlePhoto(featured, item.photo) === chosen &&
      (item.cropX ?? 50) === (edition.coverImage.x ?? 50) && (item.cropY ?? 50) === (edition.coverImage.y ?? 50) &&
      samePhotoSize(item.photoSize,edition.coverImage.photoSize))) {
      front.insertBefore(el('figure', {class:'front-photo front-cover-photo',style:photoSizeStyle(edition.coverImage.photoSize)},
        el('img', {...photoAttrs(chosen), style:'object-position:' + (edition.coverImage.x ?? 50) + '% ' + (edition.coverImage.y ?? 50) + '%'}),
        chosen.caption && el('figcaption', {}, chosen.caption),
        forPrint && chosen.credit && el('div', {class:'caption'}, chosen.credit, ' ', external(chosen.creditURL, 'Fonte immagine'), ' ', external(chosen.license, 'Licenza'))), grid);
    }
    const count = edition.pageCount ?? edition.articles.filter(article => article.published).length;
    front.append(el('p', {class:'front-editorial-foot'}, count + (count === 1 ? ' articolo nel giornale' : ' articoli nel giornale')));
    queueMicrotask(() => fitFront(front));
    return front;
  }
  addEventListener('resize',() => document.querySelectorAll('.frame-cover').forEach(front => fitFront(front)));

    text:'Il Comune di Milano ha comunicato che nel 2025 gli otto hub di aiuto alimentare della città hanno recuperato circa **1.057 tonnellate** di eccedenze. La rete intercetta alimenti ancora utilizzabili e li redistribuisce con il contributo di organizzazioni del territorio.\n\n## Una sperimentazione nelle scuole\nIl Comune riferisce anche di un progetto con biciclette da carico, che ha raccolto oltre tremila chili di pane e frutta in diciotto scuole di due municipi. Il dato riguarda questa sperimentazione specifica.\n\n## Come leggere il numero\nLe tonnellate sommano la quantità recuperata dagli otto hub in un anno. Il peso rende confrontabili le raccolte, ma da solo non dice quali alimenti fossero disponibili, con quale regolarità arrivassero o come fossero distribuiti. Il dato delle scuole descrive un singolo progetto e va letto con il suo perimetro.\n\nIl bilancio offre due possibili aperture per una redazione: il totale del cibo recuperato oppure il viaggio quotidiano di pane e frutta dalle mense ai punti di distribuzione. Entrambe le aperture si possono documentare, con domande diverse da approfondire.',

const starterFollowups = {
  'sample-milano': `## Dove comincia il recupero
Gli hub fanno parte della politica alimentare del Comune. La rete raccoglie eccedenze nei punti vendita della grande distribuzione, al mercato ortofrutticolo e in alcune mense. Il mercato ha un proprio punto di raccolta, Foody Zero Sprechi. Nella stessa rilevazione compaiono i centri di quartiere, come quelli di Isola, Lambrate e Gallaratese. Dietro il totale cittadino ci sono quindi luoghi di raccolta diversi e più organizzazioni che si occupano della redistribuzione.

Per capire che cosa comporta il recupero, si può seguire il percorso di un alimento. La prima domanda è dove diventa disponibile, per esempio a fine servizio in una mensa. La seconda è chi può ritirarlo, portarlo al punto di raccolta e consegnarlo in tempo perché possa essere consumato. Una quantità complessiva descrive l’esito di molti passaggi come questi. La descrizione di un singolo ritiro aiuta a capire il lavoro che rende possibile il risultato, mentre i dati dell’intera rete servono per valutare la scala dell’iniziativa.

## Il confronto con l’anno precedente
Il Comune indica circa 795 tonnellate recuperate nel 2024 e 1.057 nel 2025. La differenza è all’incirca di 262 tonnellate. Il confronto riguarda il **cibo intercettato dalla rete di aiuto alimentare**. Per capire quanto spreco ci sia in tutta Milano servirebbero altre misure, a partire da una stima delle eccedenze che restano fuori dai punti di raccolta. Anche l’eventuale ingresso di nuovi operatori è un’informazione da cercare quando si mettono in fila i bilanci di anni diversi.

Nel resoconto la quantità di alimenti compare anche sotto forma di pasti equivalenti. È una misura diversa dal peso, utile per comunicare al pubblico un ordine di grandezza. Una redazione dovrebbe spiegare che cosa calcola l’indicatore prima di usarlo come titolo. Tra le domande da fare a chi ha preparato i dati ci sono il criterio di conversione, il periodo considerato e la possibilità di confrontare le cifre dei diversi hub.

## Un caso da seguire nel tempo
Il progetto con le biciclette da carico permette di restringere lo sguardo a un’attività precisa. Il bilancio indica la quantità raccolta e il numero di scuole coinvolte. Da qui si può impostare un seguito dell’articolo chiedendo con quale frequenza avvenissero i ritiri, quali accordi fossero necessari con le scuole, e che cosa rendesse praticabile il tragitto per chi effettuava la consegna. Una visita o un’intervista fornirebbe dettagli diversi da quelli che si trovano nella tabella del bilancio.

Un possibile seguito è un confronto tra punti di raccolta che funzionano in contesti differenti. Per raccontarlo servirebbero gli stessi indicatori per tutti, con date e definizioni riconoscibili. Un bilancio complessivo e una cronaca dal quartiere aiutano a rispondere a domande diverse sullo stesso lavoro.`,
  'sample-ariane': `## Una missione che cambia quota
Il resoconto dell’ESA distingue due passaggi dello stadio superiore. Dopo la prima accensione del Vinci, il veicolo percorreva un’orbita ellittica, con quote di circa 300 e 600 chilometri nei punti più vicino e più lontano dalla Terra. Seguì una fase di circa 35 minuti senza spinta del motore principale. La seconda accensione rese l’orbita pressoché circolare, a circa **580 chilometri** di quota, e preparò il rilascio dei satelliti.

Rilasciare un satellite richiede di raggiungere le condizioni previste per il suo distacco. Per questo, quando si racconta una missione, «il razzo è arrivato nello spazio» e «i satelliti sono stati rilasciati nell’orbita prevista» indicano due passaggi distinti. Nel rapporto l’ESA elenca le otto missioni satellitari effettivamente rilasciate. Tra queste figurano ISTSat-1, Robusta-3A e 3Cat-4. Il rapporto separa i satelliti distaccati dagli esperimenti rimasti a bordo.

## Che cosa mancava alla fine
Nella fase conclusiva avrebbe dovuto riaccendersi ancora il Vinci. La manovra avrebbe orientato lo stadio superiore verso il rientro nell’atmosfera. Secondo l’aggiornamento dell’ESA, il funzionamento dell’unità ausiliaria di propulsione si interruppe dopo la sua seconda accensione e la manovra finale non fu eseguita. Il software di bordo passò quindi alla messa in sicurezza dello stadio. Le cause dell’interruzione erano ancora oggetto di indagine al momento di quel resoconto.

Il bilancio cambia a seconda di quale obiettivo si prende in esame. Per il rilascio dei satelliti ci sono una quota e un elenco di missioni da controllare. Per la manovra di rientro c’è un’operazione prevista che non è stata effettuata. In un articolo il lettore può trovare entrambe le informazioni accostate e capire a quale fase si riferisce ogni giudizio sulla riuscita del volo.

## Il lavoro della redazione dopo il decollo
La sequenza delle operazioni offre una traccia per tenere separati il momento della notizia e quello della verifica. Durante il decollo l’immagine mostra ciò che accade alla rampa. Le informazioni sull’orbita e sulle prove dello stadio superiore vengono invece dai dati raccolti durante il volo e ricostruiti nel rapporto tecnico. Chi scrive un aggiornamento può ordinare questi elementi lungo una stessa linea del tempo, indicando da dove provengono e quando sono diventati disponibili.

Per un articolo successivo avrebbe senso tornare su due domande: che cosa ha spiegato l’analisi dell’interruzione e quanto del profilo di volo è stato poi ripetuto in altre missioni? Il resoconto del debutto consente di precisare i risultati di quel giorno e fornisce le domande da portare al lavoro successivo.`,
  'sample-alluvione': `## Le piogge si succedono sullo stesso territorio
L’Arpae distingue due episodi particolarmente intensi che interessarono la Romagna e i rilievi centrali della regione: il primo tra l’1 e il 3 maggio, il secondo tra il 16 e il 17. Il suo rapporto mette in evidenza la **persistenza** delle precipitazioni e l’estensione dell’area raggiunta. Nei terreni già saturi, altra pioggia poteva scorrere in superficie con maggiore facilità. La successione degli episodi aiuta a spiegare per quale motivo nelle cronache dei giorni successivi comparissero ancora gli stessi bacini e le stesse zone collinari.

Esiste una differenza tra la pioggia che cade in un luogo, la piena che scende lungo un fiume e l’allagamento che si osserva in pianura. Le misure dei pluviometri, i livelli nei corsi d’acqua e le fotografie delle aree allagate documentano questi fenomeni da punti di vista diversi. La foto di un’abitazione circondata dall’acqua rende visibile un danno in un punto preciso. Per allargare l’inquadratura occorrono una mappa, una data e misure che descrivano anche le zone che la fotografia lascia fuori.

## Gli interventi durante l’emergenza
Alla nuova ondata del 16 maggio, il Servizio nazionale della Protezione Civile era già impegnato sul territorio. Il suo aggiornamento indica Bologna, Forlì-Cesena e Ravenna fra le province maggiormente interessate. Il Comitato Operativo si riunì per raccordare strutture nazionali, sala operativa regionale e prefetture. L’assistenza, le evacuazioni e la sicurezza delle aree colpite avevano priorità mentre continuava il monitoraggio del maltempo.

Gli aggiornamenti avevano destinatari e usi diversi. Un’allerta aiutava a capire dove fosse atteso un rischio nelle ore successive. Un comunicato sui soccorsi descriveva le operazioni già in corso. Una mappa delle strade interrotte sarebbe stata utile a chi organizzava uno spostamento. In una cronaca che li cita insieme, l’ora e il luogo diventano parte dell’informazione: aiutano il lettore a riconoscere un avviso operativo rispetto a un riepilogo dell’evento.

## La differenza fra un aggiornamento e un bilancio
Il Consiglio dei ministri deliberò il 23 maggio l’estensione dello stato di emergenza già dichiarato all’inizio del mese. Nel bilancio tecnico successivo, Arpae ricostruì tra l’altro l’estensione degli allagamenti e i fenomeni franosi. Questi materiali descrivono un periodo più ampio di quello coperto da un singolo bollettino durante i soccorsi. Un bilancio retrospettivo può anche includere rilievi completati quando alcune aree sono tornate accessibili.

Una redazione che torna sul posto può distinguere l’episodio di maltempo dalle fasi di assistenza e di ricostruzione. Ciascuna chiede una verifica diversa. Per raccontare le piogge servono i dati tecnici. Per ricostruire i soccorsi servono aggiornamenti datati e testimonianze situate. Per descrivere il recupero di un quartiere occorrono invece scadenze, interventi e riscontri su ciò che è stato realizzato. La notizia iniziale offre il punto di partenza per ciascuno di questi approfondimenti.`,
  'sample-cura': `## Che cosa si fa durante le giornate
Negli interventi citati dal Comune compaiono la raccolta dei rifiuti, le piantumazioni e la pulizia di muri segnati da scritte. Il calendario era distribuito su più fine settimana, con una pausa estiva. L’attività permette di osservare insieme luoghi diversi: un’area verde, un muro che affaccia su una strada, uno spazio vicino a un canale. Anche il modo di descrivere il risultato cambia con il luogo. Si può contare quanti nuovi alberi sono stati piantati oppure documentare quali porzioni di un passaggio pedonale sono state ripulite.

Nel comunicato di ottobre, il Comune annunciava due ulteriori appuntamenti dedicati ai muri del centro e ai canali. Per il fine settimana del 24 e 25 ottobre citava, tra i luoghi, via del Borgo di San Pietro e l’area della finestrella di via Piella. Per novembre indicava attività da programmare presso Savena, Navile e Reno. In un articolo datato al momento dell’annuncio, questi interventi si possono presentare come **appuntamenti previsti**. Un resoconto successivo potrebbe riportare quali lavori si sono svolti e con quale partecipazione.

## I diversi ruoli nella cura di un luogo
Il bilancio nomina gruppi di quartiere e realtà che già lavorano in quegli spazi. Annunciava, per esempio, la collaborazione con persone in pensione che avevano lavorato nei servizi ambientali di Hera e che aderivano ai Custodi dell’ambiente. Il Comune elencava anche soggetti che partecipavano a interventi specifici, come il Consorzio Canali di Bologna per l’area di via Piella. Per raccontare un singolo appuntamento, l’elenco degli aderenti permette di scegliere a chi chiedere informazioni sul lavoro concreto.

La collaborazione solleva una domanda pratica: come si dividono i compiti tra il gruppo che propone un lavoro, chi se ne occupa sul posto e chi lo segue a distanza di tempo? Si può partire da un giardino e chiedere chi ha deciso l’intervento, chi ha fornito i materiali e a chi rivolgersi nelle settimane dopo la giornata. Sono domande che si possono rivolgere anche a chi frequenta quel giardino tutti i giorni. Un sopralluogo permetterebbe di precisare quali cambiamenti siano ancora visibili.

## Un bilancio da verificare sul posto
Il numero di luoghi coinvolti dà un’idea della diffusione dell’iniziativa. Per confrontare due interventi occorre precisare la loro dimensione e il momento della rilevazione. Un’area frequentata ogni giorno richiede controlli diversi da uno spazio visitato più saltuariamente. Una serie di immagini scattate nello stesso punto, con la data, può rendere più leggibile il cambiamento. Un altro contributo può venire da chi racconta come quello spazio venga usato dopo il lavoro e quali esigenze rimangano da affrontare.`,
  'sample-strade': `## Il perimetro del confronto
I dati principali provengono dagli incidenti rilevati dalla Polizia Locale sulle strade del Comune. Il rapporto esclude autostrade e tangenziale. Questo confine è importante quando si leggono il totale e le percentuali: un dato riferito a quelle strade descrive un perimetro diverso da un bilancio che consideri anche altri tratti del sistema viario. Anche il periodo va tenuto fermo. Il 2025 viene confrontato con la **media dei due anni precedenti alla misura**, oltre che con il 2024 in alcuni passaggi del report.

Nel 2025 il Comune riporta **2.457 incidenti**, a fronte di 2.827 nella media del 2022 e del 2023. I due valori mostrano da dove deriva la diminuzione percentuale. Per i decessi, il rapporto esplicita il calcolo della media: 21 persone nel 2022, 18 nel 2023, con un riferimento medio di 19,5. La media è un valore di confronto tra anni interi. I decessi effettivi del singolo anno sono invece espressi in persone. Presentare insieme queste due informazioni aiuta a leggere i numeri in modo preciso.

## Indicatori che raccontano aspetti differenti
Il rapporto distingue il totale degli incidenti, i sinistri con feriti e il numero di persone ferite. In un incidente possono essere coinvolte più persone, perciò il conteggio degli eventi e quello dei feriti rispondono a domande diverse. Per esempio, il dato sugli incidenti con feriti descrive quante volte, nel periodo considerato, almeno una persona sia rimasta ferita. Quello sulle persone ferite descrive il numero di persone coinvolte con questo esito.

Un confronto riguarda anche i ciclisti. Il Comune indica un aumento dei ciclisti coinvolti in incidenti rispetto al periodo di riferimento e segnala un aumento dei flussi ciclistici sulle strade monitorate. Il secondo dato aiuta a leggere il primo perché segnala che la quantità di spostamenti in bicicletta può cambiare. Per stimare un rischio per viaggio servirebbero misure dei flussi e degli incidenti confrontabili per luogo, periodo e copertura. La tabella degli incidenti è uno dei materiali necessari per impostare quella verifica.

## Come formulare un titolo preciso
Una redazione può scegliere il confronto con il periodo precedente alla misura o il confronto tra 2024 e 2025. Sui decessi, per esempio, i due anni più recenti riportano rispettivamente dieci e dodici persone, mentre la media usata come riferimento è più alta di entrambi. Indicare il periodo vicino alla cifra permette al lettore di capire subito quale domanda il titolo stia ponendo.

Il rapporto riguarda una politica di sicurezza stradale, ma per discutere le cause dei cambiamenti servono ulteriori elementi: le modifiche delle strade, il numero e il tipo di spostamenti, i controlli e le differenze tra aree. Un approfondimento può partire da pochi tratti confrontabili e raccogliere dati con le stesse definizioni. In questo modo si passa da un dato cittadino alla domanda concreta su ciò che è avvenuto in un luogo preciso.`

function encodePhoto(file) {
  if (file.size > 30 * 1024 * 1024) return Promise.reject(new Error('Una foto supera 30 MB. Ridimensionala prima di caricarla.'));
  if (!/^image\/(jpeg|png|webp|avif|gif|bmp|x-ms-bmp)$/i.test(file.type)) return Promise.reject(new Error('Scegli una foto JPEG, PNG, WebP, AVIF, GIF o BMP.'));
  const url = URL.createObjectURL(file);
  return new Promise((resolve,reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const longest = Math.max(img.naturalWidth,img.naturalHeight);
        if (!longest) throw new Error('Immagine vuota');
        const scale = Math.min(1,1500/longest);
        const width = Math.max(1,Math.round(img.naturalWidth * scale));
        const height = Math.max(1,Math.round(img.naturalHeight * scale));
        const canvas = el('canvas',{width,height});
        const ctx = canvas.getContext('2d',{alpha:false});
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        let src = canvas.toDataURL('image/jpeg',.82);
        if (src.length > 650000) src = canvas.toDataURL('image/jpeg',.66);
        resolve({src,width,height,alt:'',caption:'',credit:'',creditURL:'',license:''});
      } catch { reject(new Error('La foto non può essere ridimensionata.')); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Il browser non riesce a leggere questa immagine.'));
    };
    img.src = url;
  });
}

// Compositore. La prova di inserimento usa la stessa griglia del risultato salvato.
function wireCoverMovement(paper,edition,help,announce,onCommit) {
  const instructions = help.textContent;
  let move, pointer, scrollTask = 0, ignoreClickUntil = 0;
  const original = () => $('.editable-cover',paper);
  const gripFor = id => $('[data-move-handle="'+id+'"]',paper);
  const frames = () => [...(original()?.querySelectorAll('.frame-cell') ?? [])];
  const title = id => edition.layout.find(item => item.id === id)?.title || edition.articles.find(item => item.id === id)?.title || '';

  function removePreview() {
    if (move?.preview) move.preview.remove();
    delete paper.dataset.preview;
    paper.style.minHeight = '';
  }
  function clear() {
    cancelAnimationFrame(scrollTask);
    scrollTask = 0;
    removePreview();
    if (move) gripFor(move.id)?.setAttribute('aria-pressed','false');
    frames().forEach(cell => delete cell.dataset.moving);
    help.textContent = instructions;
    move = null;
  }
  function start(id,kind) {
    clear();
    if (edition.layout.length < 2) return false;
    move = {id,kind,destination:null};
    const cell = frames().find(item => item.dataset.id === id);
    if (cell) cell.dataset.moving = 'true';
    gripFor(id)?.setAttribute('aria-pressed','true');
    help.textContent = kind === 'keyboard' ? 'Scegli un riquadro con le frecce. Premi Invio per inserirlo o Esc per annullare.'
      : 'Trascina il riquadro fino all’area in cui vuoi inserirlo.';
    announce.textContent = 'Spostamento di «'+title(id)+'».';
    return true;
  }
  function offer(destination) {
    if (!move || move.destination === destination) return;
    removePreview();
    move.destination = destination;
    move.layout = destination && R.moveIntoArea(edition,move.id,destination);
    if (!move.layout) {
      help.textContent = 'Scegli l’area in cui inserire il riquadro.';
      return;
    }
    const preview = R.frontPage({...edition,layout:move.layout},{insertion:move.id});
    preview.classList.add('move-preview');
    preview.setAttribute('aria-hidden','true');
    preview.inert = true;
    move.preview = preview;
    paper.append(preview);
    paper.style.minHeight = Math.max(original().offsetHeight,preview.offsetHeight)+'px';
    paper.dataset.preview = 'true';
    help.textContent = move.kind === 'keyboard' ? 'Premi Invio per confermare la disposizione mostrata.' : 'Rilascia per inserire il riquadro nel punto tratteggiato.';
    announce.textContent = '«'+title(move.id)+'» nell’area di «'+title(destination)+'».';
  }
  function finish(commit) {
    if (!move) return;
    const {id,destination,layout,kind} = move;
    clear();
    if (commit && layout) onCommit(layout,id,kind === 'keyboard');
    else announce.textContent = 'Spostamento annullato.';
  }
  function hit(x,y) {
    const cells = frames().map(cell => ({id:cell.dataset.id,rect:cell.getBoundingClientRect()}));
    const over = cells.find(({rect}) => x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
    if (over) return over.id === move.id ? null : over.id;
    const grid = $('.frame-grid',original()).getBoundingClientRect();
    if (x < grid.left-12 || x > grid.right+12 || y < grid.top-12 || y > grid.bottom+12) return null;
    // Il piccolo margine permette il rilascio anche nella fessura fra due riquadri.
    const distances = cells.filter(cell => cell.id !== move.id).map(({id,rect}) => ({id,distance:Math.hypot(
      Math.max(rect.left-x,0,x-rect.right), Math.max(rect.top-y,0,y-rect.bottom))}));
    const nearest = distances.sort((a,b) => a.distance-b.distance)[0];
    return nearest?.distance <= 24 ? nearest.id : null;
  }
  function scrollStep(y) {
    const margin = 70;
    if (y < margin) return -Math.ceil(Math.min(18,(margin-y)/4));
    if (y > innerHeight-margin) return Math.ceil(Math.min(18,(y-innerHeight+margin)/4));
    return 0;
  }
  function scrollWhileDragging() {
    scrollTask = 0;
    if (!move?.point || !paper.isConnected) return;
    const [x,y] = move.point;
    const step = scrollStep(y);
    if (!step) return;
    const before = scrollY;
    scrollBy({top:step,behavior:'instant'});
    if (before === scrollY) return;
    offer(hit(x,y));
    scrollTask = requestAnimationFrame(scrollWhileDragging);
  }
  function moveAt(event) {
    move.point = [event.clientX,event.clientY];
    offer(hit(...move.point));
    if (!scrollTask && scrollStep(event.clientY)) scrollTask = requestAnimationFrame(scrollWhileDragging);
  }

  paper.addEventListener('dragstart',event => {
    if (pointer || !event.dataTransfer) {event.preventDefault(); return;}
    const cell = event.target.closest('.editable-cover .frame-cell');
    if (!cell || !start(cell.dataset.id,'native')) {event.preventDefault(); return;}
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain',cell.dataset.id);
  });
  paper.addEventListener('dragover',event => {
    if (move?.kind !== 'native') return;
    event.preventDefault();
    moveAt(event);
    if (event.dataTransfer) event.dataTransfer.dropEffect = move.layout ? 'move' : 'none';
  });
  paper.addEventListener('dragleave',event => {
    if (move?.kind !== 'native') return;
    const rect = paper.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) {
      move.point = null;
      offer(null);
    }
  });
  paper.addEventListener('drop',event => {
    if (move?.kind !== 'native') return;
    event.preventDefault();
    moveAt(event);
    finish(true);
  });
  paper.addEventListener('dragend',() => {if (move?.kind === 'native') finish(false);});

  paper.addEventListener('pointerdown',event => {
    const grip = event.target.closest('[data-move-handle]');
    if (!grip || !event.isPrimary || event.button !== 0) return;
    event.preventDefault();
    grip.focus({preventScroll:true});
    pointer = {id:event.pointerId,article:grip.dataset.moveHandle,x:event.clientX,y:event.clientY,active:false};
    grip.setPointerCapture(event.pointerId);
  });
  paper.addEventListener('pointermove',event => {
    if (pointer?.id !== event.pointerId) return;
    if (!pointer.active && Math.hypot(event.clientX-pointer.x,event.clientY-pointer.y) >= 6) {
      pointer.active = start(pointer.article,'pointer');
    }
    if (pointer.active && move) moveAt(event);
  });
  function endPointer(event) {
    if (pointer?.id !== event.pointerId) return;
    const {active} = pointer;
    pointer = null;
    if (!active || move?.kind !== 'pointer') return;
    ignoreClickUntil = performance.now()+160;
    if (event.type === 'pointerup') moveAt(event);
    finish(event.type === 'pointerup');
  }
  for (const type of ['pointerup','pointercancel','lostpointercapture']) paper.addEventListener(type,endPointer);

  paper.addEventListener('click',event => {
    const grip = event.target.closest('[data-move-handle]');
    if (!grip || event.detail && performance.now() < ignoreClickUntil) return;
    const id = grip.dataset.moveHandle;
    if (move?.kind === 'keyboard') {
      if (id !== move.id) offer(id);
      if (move.layout) finish(true); else finish(false);
    } else start(id,'keyboard');
  });
  paper.addEventListener('keydown',event => {
    if (event.key === 'Escape' && move) {
      event.preventDefault();
      finish(false);
      return;
    }
    if (move?.kind !== 'keyboard') return;
    if (event.key === 'Tab') {finish(false); return;}
    const direction = {ArrowUp:-1,ArrowLeft:-1,ArrowDown:1,ArrowRight:1}[event.key];
    if (!direction) return;
    const inViewOrder = frames().map(cell => cell.dataset.id);
    const index = inViewOrder.indexOf(move.destination ?? move.id);
    let next = index+direction;
    if (inViewOrder[next] === move.id) next += direction;
    const candidate = inViewOrder[next];
    if (candidate) {
      event.preventDefault();
      offer(candidate);
      const card = move.preview?.querySelector('[data-insertion="true"]');
      card?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
    }
  });
  return () => {pointer = null; clear();};
}

function resultsFor(target, mode) {
  const {initial,rated,titles} = target.lab;
  const choices = initial.filter(item => mode === 'persona' ? ['persona','conteggio persone'].includes(item.mode) : ['gruppo','conteggio gruppi'].includes(item.mode));
  const reviews = rated.filter(item => item.mode === mode);
  const experiments = titles.filter(item => item.mode === mode);
  const index = new Map();
  for (const item of [...choices,...reviews]) {
    if (index.has(item.id)) continue;
    const article = target.articles.find(article => article.id === item.id);
    index.set(item.id,{id:item.id,title:article?.title || item.title,open:0,share:0,curious:0,
      totals:Object.fromEntries(measures.map(([key]) => [key,0])),count:0,highShare:0});
  }
  for (const row of choices) index.get(row.id)[row.question] += row.count;
  for (const row of reviews) {
    const item = index.get(row.id);
    item.count++;
    for (const [key] of measures) item.totals[key] += row.values[key];
    if (row.values.share >= 4) item.highShare++;
  }
  const entries = [...index.values()];
  const counts = Object.fromEntries(initialQuestions.map(([key]) => [key,entries.reduce((sum,item) => sum+item[key],0)]));
  return {entries,counts,reviews,experiments};
}

// Trasferimento per file. Il lettore esportato incorpora solo i dati pubblicabili.
function envelope(kind,data) {
  return {format:'notizie-2x',version:1,kind,data};
}
function download(filename,content,mime) {
  const file = new Blob([content],{type:mime});
  const url = URL.createObjectURL(file);
  const link = el('a',{href:url,download:filename});
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),4000);
  if (file.size > 12 * 1024 * 1024) showStatus('Il file scaricato supera 12 MB. Le fotografie occupano la maggior parte dello spazio.');
  else showStatus('File pronto per il download.');
}
function downloadJSON(filename,data) {
  download(filename,JSON.stringify(data,null,2),'application/json;charset=utf-8');
}
function exportProject() {
  downloadJSON(slug(project().code)+'-progetto.json',envelope('project',project()));
}
function exportFront() {
  downloadJSON(slug(edition().name)+'-prima-pagina.json',envelope('front',{code:project().code,edition:captureFront(edition())}));
}
function exportPackage() {
  downloadJSON(slug(edition().name)+'-archivio-comune.json',envelope('package',{articles:edition().articles}));
}
function exportResults(json) {
  const target = edition();
  const filename = slug(target.name)+'-risultati';
  if (json) return downloadJSON(filename+'.json',envelope('results',{edition:target.name,issue:target.issue,...target.lab}));
  const lines = [['fase','unità','articolo_id','titolo','domanda','conteggio',
    'attenzione','emozione','importanza','utilità_sociale','condivisione_dopo','motivazione','ripensamento',
    'titolo_informativo','titolo_emotivo','titolo_scelto','primo_titolo_mostrato']];
  target.lab.initial.forEach(item => lines.push(['iniziale',item.mode,item.id,item.title,item.question,item.count]));
  target.lab.rated.forEach(item => lines.push(['valutazione',item.mode,item.id,item.title,'',1,
    ...measures.map(([key]) => item.values[key]),item.comment,item.revision]));
  target.lab.titles.forEach(item => lines.push(['titoli',item.mode,item.id,item.title,'',1,'','','','','','','',
    item.neutral,item.emotional,item.pick,item.first]));
  const csv = lines.map(row => Array.from({length:lines[0].length},(_,index) => {
    const cell = String(row[index] ?? '');
    const safe = /^\s*[=+\-@]|^[\t\r\n]/.test(cell) ? "'" + cell : cell;
    return '"' + safe.replaceAll('"','""') + '"';
  }).join(';')).join('\r\n');
  download(filename+'.csv','\uFEFF'+csv,'text/csv;charset=utf-8');
}

async function readFile(file) {
  if (file.size > 80 * 1024 * 1024) throw new Error(file.name + ': il file supera 80 MB.');
  let imported;
  try { imported = JSON.parse((await file.text()).replace(/^\uFEFF/,'')); }
  catch { throw new Error(file.name + ': il file non contiene un JSON valido.'); }
  if (!isObject(imported) || imported.format !== 'notizie-2x' || imported.version !== 1 || !isObject(imported.data)) {
    throw new Error(file.name + ': formato o versione del file non riconosciuti.');
  }
  return imported;
}

    try {
      const incoming = await Promise.all(files.map(readFile));
      let message;
      if (mode === 'project') {
        if (incoming[0].kind !== 'project') throw new Error('Scegli un file esportato con Esporta progetto.');
        if (state.projects.length >= 80) throw new Error('Hai raggiunto il limite di progetti locali.');
        const copy = projectFrom(incoming[0].data);
        if (state.projects.some(item => item.id === copy.id)) {
          copy.id=uid();
          copy.code=(copy.code.slice(0,69)+' · importato').slice(0,80);
        }
        state.projects.push(copy);
        state.active=copy.id;
        selectedArticle=''; ratedArticle=''; search=''; categoryFilter='';
        currentView='compose'; lastStudioView='compose';
        message='Progetto importato come quotidiano indipendente.';
      } else if (mode === 'package') {
        if (incoming[0].kind !== 'package') throw new Error('Scegli un file esportato con Esporta archivio comune.');
        const archive = unique(arrayOf(incoming[0].data.articles,250).map(articleFrom),item => item.id);
        const current = edition();
        const ids = new Set(current.articles.map(item => item.id));
        const additions = archive.filter(item => !ids.has(item.id));
        if (current.articles.length + additions.length > 250) throw new Error('L’archivio supererebbe il limite di 250 articoli.');
        expandSavedExamples(additions);
        current.articles.push(...additions);
        message=additions.length+' articoli importati. '+(archive.length-additions.length)+' già presenti.';
      } else {
        const entries = incoming.flatMap(item => {
          if (item.kind === 'front') {
            const snapshot = editionFrom(item.data.edition,true);
            return [{id:uid(),label:(text(item.data.code,80) || snapshot.name) + ' · ' + (snapshot.issue || snapshot.name),edition:snapshot}];
          }
          if (item.kind === 'project') {
            const imported = projectFrom(item.data);
            return imported.editions.map(target => ({id:uid(),label:imported.code + ' · ' + (target.issue || target.name),edition:captureFront(target)}));
          }
          throw new Error('Per il confronto scegli progetti o prime pagine in formato JSON.');
        });
        if (state.comparison.length + entries.length > 100) throw new Error('La galleria può contenere fino a 100 prime pagine importate.');
        state.comparison.push(...entries);
        pair=entries.length > 1 ? entries.slice(0,2).map(item => item.id) : [pair[0],entries[0].id];
        message=entries.length+' prime pagine aggiunte al confronto.';
      }
      if ($('#app-dialog').open) $('#app-dialog').close();
      touch();render();showStatus(message);
    } catch (error) { fileError(error); }
  },{once:true});
  picker.click();
}
function render() {
  readerCleanup?.();
  readerCleanup = null;
  const identity = edition();
  const classLabel = editionClass(identity);
  document.title = identity.name;
  $('#journal-brand').replaceChildren(...[
    classLabel && el('span',{class:'brand-seal'},classLabel),el('span',{class:'brand-title'},identity.name)
  ].filter(Boolean));
  $('#app-footer').textContent = [classLabel,'Laboratorio di educazione ai media'].filter(Boolean).join(' · ');
  document.body.classList.toggle('presentation',presented);
  document.body.classList.toggle('reader-only',!inStudio && !presented);
  $('#top-tools').replaceChildren(...(inStudio ? [btn('Accessibilità',settingsDialog,'small'),btn('Guida',guideDialog,'small'),
    btn('Torna al giornale',() => changeView('reader'),'small')] : [btn('Apri redazione',() => changeView(lastStudioView),'small')]));
  const isClass = classSteps.includes(currentView);
  const studentNavigation = el('div',{class:'row learning-steps'}, studentSteps.map((key,index) => {
    const step = btn(nav[key],() => changeView(key),'',{'aria-current':currentView === key ? 'page' : null});
    step.prepend(el('span',{class:'step-index','aria-hidden':'true'},String(index+1)));
    return step;
  }));
  $('#navigation').replaceChildren(studentNavigation,btn('Attività di classe',() => changeView(lastClassView),'class-entry',
    {'aria-expanded':String(isClass),'aria-controls':'class-bar'}));
  const classBar = $('#class-bar');
  classBar.hidden = !isClass || presented;
  classBar.replaceChildren(el('nav',{class:'class-nav row','aria-label':'Attività di classe'},classSteps.map(key =>
    btn(nav[key],() => changeView(key),'small',{'aria-current':currentView === key ? 'page' : null})),
    btn('Presenta alla LIM',startPresentation,'small'),btn('Guida docente',guideDialog,'small')));
  const current = project();
  const projectSelect = select(state.projects.map(item => [item.id,item.code]),current.id,
    {id:'project-select',onchange:event => {state.active=event.target.value;changeEdition();focusAfter('#project-select');}});
  const editionSelect = select(current.editions.map(item => [item.id,item.issue || item.name]),edition().id,
    {id:'edition-select',onchange:event => {current.activeEdition=event.target.value;changeEdition();focusAfter('#edition-select');}});
  const projects = $('#projectbar');
  projects.dataset.expanded = String(phoneProjectOpen);
  const expandProject = btn('Progetto · ' + current.code,() => {
    phoneProjectOpen = !phoneProjectOpen;
    projects.dataset.expanded = String(phoneProjectOpen);
    expandProject.setAttribute('aria-expanded',String(phoneProjectOpen));
  },'small project-expander',{'aria-expanded':String(phoneProjectOpen)});
  projects.replaceChildren(expandProject,field('Progetto',projectSelect),field('Numero',editionSelect),
    group(btn('Nuovo quotidiano',() => projectDialog(true)),btn('Progetti e file',projectMenu)),
    el('div',{class:'save-strip row between'},el('span',{id:'save-phase',class:'save-phase',role:'status'}),
      group(btn('Salva il mio giornale',() => persist(true),'small primary'),btn('Esporta una copia JSON',exportProject,'small mobile-backup'))));
  setSavePhase(savePhase);
  const controls = $('#presentation-bar');
  controls.hidden = !presented;
  if (presented) {
    controls.className='presentation-head row between';
    controls.replaceChildren(el('div',{class:'row'},btn('Giornale',() => changeView('reader'),'small'),
      teacher && btn('Laboratorio',() => changeView('lab'),'small'),
      teacher && btn('Risultati',() => changeView('results'),'small'),
      teacher && btn('Confronta',() => changeView('compare'),'small')),
    el('div',{class:'row'},select(current.editions.map(item => [item.id,item.issue || item.name]),edition().id,
      {'aria-label':'Numero da presentare',id:'presentation-issue',style:'width:auto',onchange:event => {
        current.activeEdition=event.target.value;changeEdition();focusAfter('#presentation-issue');
      }}),teacher && btn('Selezione',presentationOptions,'small'),btn('Accessibilità',settingsDialog,'small'),
      btn('Schermo intero',fullscreen,'small'),btn('Torna alla redazione',leavePresentation,'small')));
  }
  const view = $('#view');
  const views = {archive:editArchive,compose:showCompose,compare:compareView,lab:showLab,results:resultView};
  if (currentView === 'reader') {
    const contents = el('div',{id:'reader-host'});
    view.replaceChildren(el('h2',{class:'sr'},'Sfoglio il giornale'),contents);
    readerCleanup = R.mountReader(contents,presentingEdition(),state.settings,{status:showStatus,changeSettings:changes => updateSetting(changes,false)});

  } else view.replaceChildren(views[currentView]());
  sectionTitleFocus();
}
(async function start() {
  try {
    database = await openDB();
    const saved = await new Promise((resolve,reject) => {
      const request = database.transaction('workspace','readonly').objectStore('workspace').get('current');
      request.onsuccess=() => resolve(request.result);
      request.onerror=() => reject(request.error);
    });
    if (saved) {
      diskRevision=saved.revision || 0;
      savePhase='saved';
      const value=saved.state;
      if (value?.version !== 1) throw new Error('Archivio incompatibile');
      const projects=arrayOf(value.projects,80);
      if (!projects.length) throw new Error('Archivio vuoto');
      state={version:1,projects,active:value.active,settings:{...defaultSettings(),...value.settings},comparison:arrayOf(value.comparison,100)};
      let expanded = false;
      for (const project of projects) {
        for (const number of project.editions) {
          if (expandSavedExamples(number.articles)) expanded = true;
        }
      }
      if (expanded) touch();
    }
  } catch {
    storageError = true;
    savePhase='unavailable';
    storageWarning('Il salvataggio nel browser non è disponibile. Puoi lavorare e conservare il progetto con Esporta progetto.');
  }
  document.documentElement.dataset.contrast = String(state.settings.contrast);
  render();
})();
</script>
