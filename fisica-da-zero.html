const lessons = [
{id:'misura',title:'Misurare: numero e unità',group:'Partire dal concreto',goal:'Scegliere lo strumento e comunicare una misura completa.',need:'Puoi iniziare qui: servono solo il conteggio e l’osservazione.',
teach:`<h2>Che cosa vuole sapere la fisica?</h2><p>La fisica studia i fenomeni naturali: come si muove un oggetto, quanto dura un evento, come cambia la temperatura. Per confrontare le osservazioni usiamo <strong>grandezze misurabili</strong>.</p><p>La lunghezza è una grandezza. Un righello è uno strumento. Il centimetro è un’unità: una quantità scelta come riferimento. Sono tre cose diverse.</p>${callout('<p><strong>Misurare significa confrontare con un’unità.</strong> Dire «12» non basta: 12 cm e 12 m sono lunghezze diverse.</p>')}${equation('lunghezza = 12,4 cm')}<p>In questa scrittura <strong>12,4 è il numero</strong> e <strong>cm è il simbolo dell’unità</strong>. La misura racconta entrambe le informazioni.</p><h3>Come usare il righello</h3><ol class="steps"><li>Metti l’inizio dell’oggetto sulla <strong>tacca 0</strong>, che può essere diversa dal bordo del righello.</li><li>Allinea il righello al bordo dell’oggetto e osserva dall’alto.</li><li>Leggi la tacca all’altro estremo e scrivi numero e unità.</li></ol><div id="teaching-visual"></div>${detail('Le grandezze fondamentali del SI',`<p>Il Sistema Internazionale (SI) è il linguaggio comune delle unità. Per iniziare useremo soprattutto lunghezza, massa e tempo.</p>${table('Sette grandezze fondamentali',['Grandezza','Unità','Simbolo'],[['Lunghezza','metro','m'],['Massa','chilogrammo','kg'],['Tempo','secondo','s'],['Temperatura termodinamica','kelvin','K'],['Corrente elettrica','ampere','A'],['Quantità di sostanza','mole','mol'],['Intensità luminosa','candela','cd']])}`)}${callout('<p>Ogni strumento ha tacche e limiti di lettura. Scrivi solo le cifre che puoi davvero leggere e indica sempre l’unità della misura.</p>')}`,
example:`<h2>Leggere i millimetri</h2><p>Una striscia parte dalla tacca 0. Finisce quattro tacche piccole dopo 12 cm. Tra 12 e 13 cm ci sono dieci intervalli uguali.</p><ol class="steps"><li>Ogni intervallo piccolo è 1 mm = 0,1 cm.</li><li>Quattro intervalli corrispondono a 4 mm = 0,4 cm.</li><li>Aggiungi alla parte intera: 12 cm + 0,4 cm = <strong>12,4 cm</strong>.</li></ol><p>Non aggiungere cifre inventate: il righello non giustifica una scrittura come 12,40000 cm.</p><h3>Prova con un oggetto vero</h3><p>Prendi una striscia di carta e misurala seguendo le tre istruzioni. Confronta poi la tua lettura con 12,4 cm.</p>`,
visual:'ruler',qs:[choice('Quale coppia è adatta a misurare la durata di una corsa?',['Righello e centimetri','Cronometro e secondi','Bilancia e chilogrammi'],1,'Pensa a quale strumento misura il tempo.','La durata si misura con un cronometro e si può esprimere in secondi.','Spiega perché «secondo» non è il nome dello strumento.'),numeric('Un oggetto va dalla tacca 2 cm alla tacca 9 cm. Quanto è lungo?',7,'cm','La lunghezza è la differenza tra la lettura finale e quella iniziale.','9 cm − 2 cm = 7 cm. Si può misurare anche senza partire da zero, usando la differenza.','Come controlleresti il risultato riposizionando il righello?')]},
{id:'decimali',title:'Decimi, centesimi e virgola',group:'La matematica che serve',goal:'Capire il valore delle cifre, leggere e confrontare decimali.',need:'Saper contare fino a dieci. Riprendi «Misurare» se numero e unità si confondono.',
teach:`<h2>Una parte di un intero</h2><p>Dividi una stessa unità in <strong>10 parti uguali</strong>. Ogni parte è un decimo: si scrive 1/10 oppure 0,1. Cinque parti sono cinque decimi: 5/10 = 0,5, cioè la metà.</p><p>Dividi l’unità in <strong>100 parti uguali</strong>. Ogni parte è un centesimo: 1/100 = 0,01. Un decimo contiene dieci centesimi.</p><div id="teaching-visual"></div>${table('La posizione dà valore alla cifra',['Unità','Decimi','Centesimi','Numero'],[['0','3','5','0,35'],['2','0','4','2,04']])}<p>0,35 = 3 decimi + 5 centesimi. 2,04 = 2 unità + 4 centesimi: lo zero indica che non ci sono decimi.</p>${callout('<p><strong>0,5 = 0,50.</strong> Lo zero aggiunto alla fine della parte decimale non cambia il valore numerico. Per confrontare 0,5 e 0,08 scrivi 0,50 e 0,08: 50 centesimi sono più di 8.</p>')}${detail('Frazione e divisione','<p>La barra in 3/10 significa «diviso»: 3/10 = 3 ÷ 10 = 0,3. Nelle formule di fisica una frazione indica un rapporto, non due numeri separati.</p>')}`,
example:`<h2>Confrontare 0,4 e 0,35</h2><ol class="steps"><li>Usa parti della stessa dimensione: 0,4 = 0,40.</li><li>Confronta 40 centesimi con 35 centesimi.</li><li>40 è maggiore di 35, quindi <strong>0,4 &gt; 0,35</strong>.</li></ol><p>Non contare le cifre: avere più cifre dopo la virgola non significa avere un numero più grande.</p>${equation('0,4 m = 40 cm &nbsp; · &nbsp; 0,35 m = 35 cm')}`,
visual:'decimals',qs:[numeric('Scrivi come numero decimale 7 centesimi.',.07,'','La prima posizione dopo la virgola è quella dei decimi; la seconda è quella dei centesimi.','7/100 = 0,07. Lo zero dei decimi mantiene il 7 nella posizione dei centesimi.','Qual è la differenza tra 0,7 e 0,07?'),choice('Quale numero è maggiore?',['0,09','0,8','Sono uguali'],1,'Confronta le due quantità in centesimi.','0,8 = 0,80. Ottanta centesimi sono più di nove centesimi.','Descrivi il confronto usando parti uguali di una barra.')]},
{id:'operazioni',title:'Moltiplicare e dividere',group:'La matematica che serve',goal:'Dare significato a ×, ÷ e al rapporto «per ogni».',need:'Decimi e centesimi: le cifre cambiano posizione quando cambia il valore.',
teach:`<h2>Due operazioni, due domande</h2><p><strong>Moltiplicare</strong> può significare ripetere una quantità: 4 gruppi da 3 unità fanno 4 × 3 = 12 unità. <strong>Dividere</strong> può significare distribuire in parti uguali: 12 unità divise in 4 gruppi danno 3 unità per gruppo.</p>${equation('12 ÷ 4 = 12/4 = 3')}<p>Controlla la divisione con l’operazione inversa: 3 × 4 = 12. Non si può dividere per zero.</p><h3>Che cosa cambia con 10?</h3>${table('Ogni cifra cambia valore',['Numero iniziale','Operazione','Risultato'],[['0,35','× 10','3,5'],['0,35','÷ 10','0,035'],['24','÷ 100','0,24']])}${callout('<p>Moltiplicare per 10 rende ciascuna cifra dieci volte più importante. Dividere per 10 la rende dieci volte meno importante. La virgola aiuta a rappresentare questo cambiamento; non è uno spostamento senza significato.</p>')}<p>Per × 100 ripeti due volte × 10. Per ÷ 100 ripeti due volte ÷ 10. Anche con i decimali puoi controllare il risultato con l’operazione inversa.</p>${detail('Prima delle formule: il rapporto','<p>Se 20 cubetti uguali hanno una massa totale di 60 g, 60 ÷ 20 = 3 g è la massa <strong>per cubetto</strong>. La parola «per» esprime qui quanta massa corrisponde a una sola unità: è il ponte verso la densità.</p>')}`,
example:`<h2>Da 0,6 a 0,006</h2><ol class="steps"><li>Dividi per 10: 0,6 ÷ 10 = 0,06.</li><li>Dividi ancora per 10: 0,06 ÷ 10 = 0,006.</li><li>Hai diviso per 100. Controlla: 0,006 × 100 = 0,6.</li></ol><h3>Un rapporto concreto</h3><p>Quattro porzioni uguali hanno in tutto una massa di 200 g. Per una porzione: 200 g ÷ 4 = 50 g. Per ritrovare il totale: 50 g × 4 = 200 g.</p>`,
qs:[numeric('Calcola 0,24 ÷ 10.',.024,'','Il risultato deve essere dieci volte più piccolo di 0,24.','0,24 ÷ 10 = 0,024. Controllo: 0,024 × 10 = 0,24.','Perché 2,4 non può essere il risultato?'),numeric('Sei pezzi uguali hanno una massa totale di 90 g. Qual è la massa di un pezzo?',15,'g','Distribuisci la massa totale tra i sei pezzi.','90 g ÷ 6 = 15 g per pezzo. Controllo: 15 × 6 = 90.','Quale informazione del testo permette di usare la divisione?')]},
{id:'potenze',title:'Potenze di dieci',group:'Scrivere e confrontare',goal:'Leggere base ed esponente, anche zero e negativo.',need:'Moltiplicare e dividere per 10.',
teach:`<h2>Una scrittura breve</h2><p>In 10<sup>3</sup>, <strong>10 è la base</strong> e <strong>3 è l’esponente</strong>. Con un esponente intero positivo, ripeti il fattore 10: 10<sup>3</sup> = 10 × 10 × 10 = 1000. Non significa 10 × 3.</p>${table('Un passo di esponente cambia il valore di un fattore 10',['Potenza','Significato','Valore'],[[power(2),'10 × 10','100'],[power(1),'10','10'],[power(0),'il valore da cui parte la sequenza','1'],[power(-1),'1 ÷ 10','0,1'],[power(-2),'1 ÷ 100','0,01'],[power(-3),'1 ÷ 1000','0,001']])}${callout('<p><strong>10<sup>−3</sup> è positivo.</strong> Il meno riguarda l’esponente: indica la divisione per 1000. Per avere un numero negativo serve un meno davanti al valore, come −1000.</p>')}<p>Scendendo di 1 nell’esponente dividi per 10; salendo di 1 moltiplichi per 10. Questo spiega anche perché 10<sup>0</sup> = 1: 10<sup>1</sup> ÷ 10 = 1.</p><div id="teaching-visual"></div>`,
example:`<h2>Leggere 3 × 10<sup>−2</sup></h2><ol class="steps"><li>Interpreta la potenza: 10<sup>−2</sup> = 1/100 = 0,01.</li><li>Moltiplica per 3: 3 × 0,01 = 0,03.</li><li>Il risultato è positivo e minore di 1.</li></ol>${equation('3 × 10<sup>−2</sup> = 0,03')}<p>A parità di coefficiente, 3 × 10<sup>−1</sup> è dieci volte maggiore di 3 × 10<sup>−2</sup>.</p>`,
visual:'powers',qs:[numeric('Quanto vale 10 elevato a zero?',1,'','Segui la sequenza: 100 → 10 → … Ogni volta dividi per 10.','10⁰ = 1, perché 10 ÷ 10 = 1.','Perché l’esponente zero non fa diventare il valore zero?'),numeric('Scrivi in decimale 6 × 10⁻³.',.006,'','Prima interpreta 10⁻³ come un millesimo, poi considera sei millesimi.','10⁻³ = 0,001; 6 × 0,001 = 0,006.','Il meno appartiene al numero o all’esponente?')]},
{id:'scientifica',title:'Notazione scientifica',group:'Scrivere e confrontare',goal:'Passare tra scrittura decimale e a × 10ⁿ mantenendo il valore.',need:'Valore posizionale, potenze di dieci e moltiplicazione.',
teach:`<h2>Lo stesso numero, meno zeri</h2><p>Per numeri positivi, la notazione scientifica ha la forma <strong>a × 10<sup>n</sup></strong>: il coefficiente a è almeno 1 e minore di 10; n è un intero.</p>${equation('4500 = 4,5 × 10<sup>3</sup> &nbsp; · &nbsp; 0,0045 = 4,5 × 10<sup>−3</sup>')}<p>Per 4500 scegli 4,5: per recuperare 4500 devi moltiplicare per 1000. Per 0,0045 scegli ancora 4,5: per recuperare 0,0045 devi dividere per 1000.</p>${callout('<p>La notazione scientifica <strong>non arrotonda</strong> da sola. 4,567 × 10³ = 4567 esattamente; 4,6 × 10³ è invece un valore arrotondato se il dato iniziale è 4567.</p>')}<h3>Controlla tre cose</h3><ol class="steps"><li>Il coefficiente rispetta 1 ≤ a &lt; 10?</li><li>La potenza ricostruisce il valore iniziale?</li><li>Hai mantenuto l’unità, se si tratta di una misura?</li></ol>${detail('Esponente zero, segno e casi speciali','<p>5 = 5 × 10⁰. I numeri tra 1 incluso e 10 escluso hanno esponente zero. Per numeri negativi si usa 1 ≤ |a| &lt; 10, per esempio −450 = −4,5 × 10². Zero si scrive semplicemente 0: non ha un coefficiente normalizzato.</p>')}${detail('Moltiplicare e dividere in notazione scientifica',`<p>Moltiplica i coefficienti e <strong>somma</strong> gli esponenti: (3 × 10²) × (2 × 10³) = 6 × 10⁵.</p><p>Dividi i coefficienti e <strong>sottrai</strong> gli esponenti: (8 × 10⁴) ÷ (2 × 10²) = 4 × 10².</p><p>Se il coefficiente esce dall’intervallo, normalizzalo: 12 × 10³ = 1,2 × 10⁴. Anche le unità partecipano: m × m = m².</p><p>Per somme e differenze porta prima le potenze allo stesso esponente: 2 × 10³ + 3 × 10² = 2 × 10³ + 0,3 × 10³ = 2,3 × 10³.</p>`)}`,
example:`<h2>Una lunghezza di 0,00072 m</h2><ol class="steps"><li>Scegli il coefficiente 7,2, compreso tra 1 e 10.</li><li>Per tornare a 0,00072 devi dividere 7,2 per 10 000: quattro divisioni per 10.</li><li>Scrivi <strong>0,00072 m = 7,2 × 10<sup>−4</sup> m</strong>.</li></ol><p>Controllo: 7,2 × 0,0001 = 0,00072. 72 × 10<sup>−5</sup> ha lo stesso valore, ma non è una scrittura scientifica normalizzata perché 72 è maggiore di 10.</p>`,
qs:[choice('Quale è la notazione scientifica normalizzata di 32 000?',['32 × 10³','3,2 × 10⁴','0,32 × 10⁵'],1,'Le tre scritture hanno lo stesso valore: guarda l’intervallo del coefficiente.','3,2 × 10⁴ è normalizzata. 32 e 0,32 non rispettano 1 ≤ a < 10.','Come ricostruisci 32 000 da 3,2 × 10⁴?'),numeric('Completa l’esponente: 0,0009 m = 9 × 10ⁿ m. Quanto vale n?',-4,'','Quante divisioni per 10 riportano 9 a 0,0009?','9 ÷ 10 000 = 0,0009, quindi n = −4.','Perché l’unità m rimane la stessa?')]},
{id:'conversioni',title:'Cambiare unità: lunghezza e massa',group:'Usare le misure',goal:'Convertire usando il valore delle unità, con un controllo del risultato.',need:'Decimali e moltiplicazione o divisione per 10, 100, 1000.',
teach:`<h2>L’oggetto resta lo stesso</h2><p>Se esprimi una lunghezza in un’unità più piccola, servono più unità per coprirla: il numero aumenta. Se scegli un’unità più grande, il numero diminuisce.</p>${equation('1 m = 10 dm = 100 cm = 1000 mm')}${table('Prefissi che useremo',['Prefisso','Simbolo','Fattore'],[['kilo','k','1000 = '+power(3)],['deci','d','0,1 = '+power(-1)],['centi','c','0,01 = '+power(-2)],['milli','m','0,001 = '+power(-3)],['micro','μ','0,000001 = '+power(-6)],['nano','n','0,000000001 = '+power(-9)]])}<p>Per la massa: <strong>1 kg = 1000 g</strong> e <strong>1 g = 1000 mg</strong>. Il simbolo kg si scrive con lettere minuscole.</p>${callout('<p><strong>Prevedi → usa l’equivalenza → calcola → controlla.</strong> Non scegliere × o ÷ guardando solo la direzione di una freccia: chiediti quanto vale l’unità di partenza nella nuova unità.</p>')}<div id="teaching-visual"></div>`,
example:`<h2>Convertire 0,3 dm in metri</h2><ol class="steps"><li>Il metro è più grande del decimetro: prevedi un numero minore.</li><li>Usa 1 dm = 0,1 m.</li><li>0,3 dm = 0,3 × 0,1 m = <strong>0,03 m</strong>.</li><li>Controllo: 0,03 m × 10 = 0,3 dm.</li></ol><h3>Una massa</h3><p>2,4 kg = 2,4 × 1000 g = 2400 g. Il grammo è più piccolo: lo stesso oggetto è descritto da un numero maggiore.</p>`,
visual:'conversion',qs:[numeric('Converti 35 cm in metri.',.35,'m','Usa 1 cm = 0,01 m.','35 × 0,01 = 0,35, quindi 35 cm = 0,35 m.','Perché il numero diminuisce?'),numeric('Converti 0,08 kg in grammi.',80,'g','Un chilogrammo equivale a 1000 grammi.','0,08 × 1000 = 80, quindi 0,08 kg = 80 g.','Il valore numerico aumenta: la massa è cambiata?')]},
{id:'tempo',title:'Minuti, ore e secondi',group:'Usare le misure',goal:'Convertire intervalli di tempo senza applicare la scala decimale.',need:'Moltiplicazione, divisione e somma.',
teach:`<h2>Qui il fattore non è dieci</h2><p>Il secondo (s) è l’unità SI dell’intervallo di tempo. Un minuto dura 60 secondi; un’ora dura 60 minuti. Le conversioni tra queste unità <strong>non usano fattori di 10</strong>.</p>${equation('1 min = 60 s &nbsp; · &nbsp; 1 h = 3600 s')}<p>Da minuti a secondi moltiplica per 60. Da secondi a minuti dividi per 60. Da ore a secondi moltiplica per 3600.</p>${callout('<p><strong>1,5 min non significa 1 min e 5 s.</strong> 0,5 min è mezzo minuto: 30 s. Quindi 1,5 min = 90 s.</p>')}<h3>Tempi composti</h3><p>Per 2 min e 15 s, converti prima 2 min in 120 s, poi aggiungi 15 s: il totale è 135 s. Somma solo quantità espresse nella stessa unità.</p>${detail('Giorni e anni','<p>Negli esercizi scolastici 1 giorno = 24 h = 86 400 s. Un intervallo di 365 giorni equivale a 31 536 000 s; non tutti gli anni civili hanno 365 giorni.</p>')}`,
example:`<h2>Da 2 h e 10 min a secondi</h2><ol class="steps"><li>Converti le ore: 2 × 3600 s = 7200 s.</li><li>Converti i minuti: 10 × 60 s = 600 s.</li><li>Somma nella stessa unità: 7200 s + 600 s = <strong>7800 s</strong>.</li></ol><p>Controllo: il risultato è maggiore di 7200 s, cioè di due ore.</p>`,
qs:[numeric('Quanti secondi dura un intervallo di 1,5 min?',90,'s','Mezzo minuto dura la metà di 60 s.','1,5 × 60 = 90 s. La parte 0,5 min vale 30 s.','Perché non si moltiplica per 100?'),numeric('Converti 3 min e 20 s in secondi.',200,'s','Converti prima i minuti, poi aggiungi i secondi.','3 × 60 + 20 = 200 s.','Come riconverti 200 s in minuti e secondi?')]},
{id:'volume',title:'Area e volume',group:'Usare le misure',goal:'Distinguere lunghezza, superficie e spazio occupato; capire cm² e cm³.',need:'Moltiplicazione e unità di lunghezza.',
teach:`<h2>Una, due, tre dimensioni</h2><p>La <strong>lunghezza</strong> descrive una distanza. L’<strong>area</strong> descrive una superficie: per un rettangolo A = base × altezza. Il <strong>volume</strong> descrive lo spazio occupato: per un parallelepipedo V = lunghezza × larghezza × altezza.</p>${equation('cm × cm = cm² &nbsp; · &nbsp; cm × cm × cm = cm³')}<p>Un cm² è l’area di un quadrato con lato 1 cm. Un cm³ è il volume di un cubo con lato 1 cm. Area e volume sono grandezze derivate: combinano lunghezze.</p><h3>Il caso del cubo</h3><p>Un cubo ha tre dimensioni uguali. Chiamiamo <strong>l</strong> la lunghezza di uno spigolo: V = l × l × l = l³. Il simbolo l³ significa tre fattori uguali, non l × 3.</p><p>Un cubo con spigolo 2 cm ha una base di 2 × 2 = 4 cm². Immagina due strati alti 1 cm, ciascuno con quattro cubetti: in tutto 2 × 2 × 2 = <strong>8 cm³</strong>. È il volume di otto cubetti da 1 cm³.</p><div id="teaching-visual"></div>${callout('<p>Poiché 1 m = 100 cm, <strong>1 m² = 100 × 100 cm² = 10 000 cm²</strong> e <strong>1 m³ = 100 × 100 × 100 cm³ = 1 000 000 cm³</strong>. Il fattore di conversione va elevato al quadrato o al cubo.</p>')}${table('Volume e litro',['Equivalenza','Significato'],[['1 L = 1 dm³','un cubo di lato 1 dm'],['1 mL = 1 cm³','un cubo di lato 1 cm'],['1 m³ = 1000 L','1000 cubi da 1 dm³']])}<p>Il litro (L) è un’unità di volume ammessa con il SI; l’unità SI del volume è il metro cubo (m³). Il litro è un’unità, non una grandezza.</p>`,
example:`<h2>Una scatola rettangolare</h2><p>Le dimensioni esterne di un blocco pieno sono 4 cm, 3 cm e 2 cm.</p><ol class="steps"><li>Area della base: 4 cm × 3 cm = 12 cm².</li><li>Volume: 12 cm² × 2 cm = <strong>24 cm³</strong>.</li><li>Controllo: il blocco contiene il volume di 24 cubetti da 1 cm³.</li></ol><p>Per un oggetto irregolare puoi misurare l’aumento del livello dell’acqua in un cilindro graduato, se l’oggetto si immerge completamente e non si scioglie: V = lettura finale − lettura iniziale.</p>`,
visual:'volume',qs:[numeric('Un blocco misura 5 cm × 2 cm × 3 cm. Calcola il volume.',30,'cm³','Moltiplica le tre dimensioni.','5 × 2 × 3 = 30 cm³. Le tre unità cm si combinano in cm³.','Come cambierebbe il volume raddoppiando solo una dimensione?'),numeric('Un oggetto immerso porta l’acqua da 40 mL a 57 mL. Qual è il suo volume?',17,'cm³','Calcola solo l’aumento del volume dell’acqua; 1 mL = 1 cm³.','57 − 40 = 17 mL = 17 cm³.','Quali condizioni rendono valida questa misura?')]},
{id:'stima',title:'Uguaglianza, arrotondamento e stima',group:'Scrivere e confrontare',goal:'Distinguere scrittura equivalente, valore arrotondato e ordine di grandezza.',need:'Decimali, notazione scientifica e confronto tra numeri.',
teach:`<h2>Due simboli, due significati</h2><p><strong>=</strong> indica lo stesso valore. <strong>≈</strong> indica un valore approssimato. Devi specificare a quale precisione arrotondi.</p>${equation('0,0008 m = 8 × 10<sup>−4</sup> m<br>0,0008 m ≈ 0,001 m &nbsp; (al millesimo)')}<p>Per arrotondare 1,274 ai centesimi conserva due cifre dopo la virgola. Osserva la terza cifra: è 4, minore di 5. Quindi 1,274 ≈ 1,27. Per 1,278 la terza cifra è 8: aumenta il centesimo e ottieni 1,28.</p>${callout('<p>Un’uguaglianza tra scritture dello stesso dato non afferma che la misura fisica sia priva di incertezza. 12,4 cm = 0,124 m è una conversione esatta del valore comunicato.</p>')}<h3>Ordine di grandezza: dichiariamo la convenzione</h3><p>In queste attività userai questa <strong>regola di stima</strong>: per a × 10ⁿ, se a &lt; 5 scegli 10ⁿ; se a ≥ 5 scegli 10ⁿ⁺¹. La useremo qui per numeri positivi.</p><p>Per esempio: 3 × 10⁴ ha ordine 10⁴; 8 × 10⁴ ha ordine 10⁵. È una stima della scala, non una scrittura equivalente.</p>${detail('Perché specificare la regola?','<p>In altri testi si usano convenzioni diverse, per esempio una soglia √10 per la vicinanza su scala logaritmica. La soglia 5 non coincide con la potenza più vicina in ogni possibile senso matematico. In queste attività usa sempre la stessa regola.</p>')}`,
example:`<h2>Tre modi di descrivere 0,0008 m</h2><ol class="steps"><li>Scrittura equivalente: <strong>8 × 10⁻⁴ m</strong>, con il segno =.</li><li>Arrotondamento al millesimo di metro: <strong>0,001 m</strong>, con il segno ≈.</li><li>Ordine di grandezza con la regola della classe: 8 ≥ 5, quindi aumenta l’esponente da −4 a −3: <strong>10⁻³ m</strong>.</li></ol><p>In questo esempio le ultime due stime coincidono. Non è una regola generale: arrotondare a una posizione decimale e stimare l’ordine di grandezza sono operazioni diverse.</p>`,
qs:[choice('Completa: 0,006 m … 6 × 10⁻³ m.',['=','≈'],0,'Trasforma la potenza in decimale e confronta.','I valori coincidono: usa =. Qui non hai arrotondato.','Che cosa cambierebbe se scrivessi 0,01 m?'),numeric('Usa la soglia 5 della classe. Per 7 × 10⁻⁵, quale esponente ha l’ordine di grandezza?',-4,'','Poiché 7 ≥ 5, aumenta l’esponente di una unità.','−5 + 1 = −4. L’ordine è 10⁻⁴, non il valore esatto 7 × 10⁻⁵.','Perché −4 è maggiore di −5?')]},
{id:'densita',title:'Densità: massa per volume',group:'Collegare le grandezze',goal:'Capire il rapporto m/V e confrontare corpi senza confondere massa e densità.',need:'Divisione, massa, volume e unità cubiche.',
teach:`<h2>Quanta massa in uno stesso spazio?</h2><p>Due blocchi con lo stesso volume possono avere masse diverse. La <strong>densità</strong> indica quanta massa corrisponde a un’unità di volume.</p>${equation('d = m/V &nbsp; → &nbsp; densità = massa ÷ volume')}<p>m indica la massa del corpo, V il suo volume. Il simbolo m dentro una formula indica una grandezza; m dopo un numero può indicare l’unità metro: leggi il contesto.</p><p>Se un blocco ha massa 60 g e volume 20 cm³, d = 60 ÷ 20 = <strong>3 g/cm³</strong>. Significa: 3 grammi per ogni centimetro cubo.</p><div id="teaching-visual"></div>${callout('<p><strong>Più massa non significa sempre più densità.</strong> Un corpo grande può avere molta massa e poca densità. Per confrontare devi dividere ogni massa per il proprio volume.</p>')}<p>L’unità SI è kg/m³. Puoi usare g/cm³ con dati coerenti: <strong>1 g/cm³ = 1000 kg/m³</strong>. Il volume deve essere maggiore di zero.</p>${detail('Che cosa dice il materiale?','<p>Per lo stesso materiale omogeneo, alle stesse condizioni, raddoppiare massa e volume lascia la densità invariata. La densità può dipendere da temperatura, composizione e porosità. Confrontarla con una tabella aiuta a formulare un’ipotesi, ma da sola non identifica con certezza un materiale. La massa non è il peso: la massa si esprime in kg, il peso è una forza.</p>')}`,
example:`<h2>Due blocchi diversi</h2>${table('Dati didattici, non misure di materiali reali',['Blocco','Massa','Volume','Densità'],[['A','80 g','20 cm³','4 g/cm³'],['B','120 g','60 cm³','2 g/cm³']])}<ol class="steps"><li>Per A: 80 ÷ 20 = 4 g/cm³.</li><li>Per B: 120 ÷ 60 = 2 g/cm³.</li><li>B ha più massa, ma A è più denso: ogni cm³ di A contiene il doppio della massa.</li></ol><p>Controllo delle unità: grammi divisi per centimetri cubi danno g/cm³.</p>`,
visual:'density',qs:[numeric('Un blocco ha massa 84 g e volume 28 cm³. Calcola la densità.',3,'g/cm³','Dividi la massa per il volume.','84 g ÷ 28 cm³ = 3 g/cm³.','Che cosa significa fisicamente il numero 3?'),choice('Dallo stesso materiale omogeneo ricavi un blocco con il doppio del volume e della massa. Alle stesse condizioni, la densità…',['raddoppia','si dimezza','rimane uguale'],2,'Scrivi il nuovo rapporto: (2 × massa)/(2 × volume).','Il fattore 2 si semplifica. La densità rimane uguale.','Perché la densità non dipende dalla quantità di materiale in questo caso?')]},
{id:'inverse',title:'Ricavare massa e volume',group:'Collegare le grandezze',goal:'Scegliere e spiegare una formula inversa, prima di sostituire i numeri.',need:'Densità e operazioni inverse: dividere annulla una moltiplicazione.',
teach:`<h2>Una relazione, tre domande</h2><p>Se conosci massa e volume, trovi la densità. Se conosci densità e volume, trovi la massa. Se conosci massa e densità, trovi il volume.</p>${equation('d = m/V &nbsp; · &nbsp; m = d × V &nbsp; · &nbsp; V = m/d')}<h3>Perché funzionano le formule inverse?</h3><ol class="steps"><li>Parti da d = m/V. Moltiplica entrambi i lati per V: d × V = (m/V) × V = m.</li><li>Hai ottenuto m = d × V.</li><li>Per trovare V, dividi entrambi i lati per d: m/d = (d × V)/d = V.</li></ol>${callout('<p>Un’equazione è un’uguaglianza. Per conservarla, fai la <strong>stessa operazione su entrambi i lati</strong>. Non devi imparare un generico «sposta il numero» senza sapere perché.</p>')}<h3>Prima del calcolo</h3><p>Scrivi i dati con le unità. Nomina l’incognita. Scegli la formula. Controlla che le unità siano coerenti, poi sostituisci i numeri.</p>`,
example:`<h2>Quanto volume occupa?</h2><p>Un blocco ha massa 45 g e densità 3 g/cm³. Devi trovare V.</p><ol class="steps"><li>Dati: m = 45 g, d = 3 g/cm³. Incognita: V.</li><li>Formula: V = m/d.</li><li>Calcolo: 45 ÷ 3 = <strong>15 cm³</strong>.</li><li>Controllo: 3 g/cm³ × 15 cm³ = 45 g.</li></ol><h3>E per trovare la massa?</h3><p>Con d = 2 g/cm³ e V = 8 cm³: m = d × V = 16 g. Ogni cm³ contiene 2 g; otto cm³ contengono 16 g.</p>`,
qs:[numeric('La densità è 4 g/cm³ e il volume è 6 cm³. Qual è la massa?',24,'g','Ripeti 4 g per ciascuno dei sei cm³.','m = d × V = 4 × 6 = 24 g.','Come controlli il risultato con la formula della densità?'),numeric('La massa è 72 g e la densità è 6 g/cm³. Qual è il volume?',12,'cm³','Quanti gruppi da 6 g trovi in 72 g?','V = m/d = 72 ÷ 6 = 12 cm³.','Quali unità avresti dovuto convertire se la massa fosse stata in kg?')]}
];
const state={view:'home',lesson:0,stage:'teach',q:0,records:{},notes:{},diagnostic:{},exam:{},powerPlaceSeen:false};

 add('Panoramica',()=>show('home'),state.view==='home');add('Da dove comincio?',()=>show('diagnostic'),state.view==='diagnostic');

}

function renderLesson(){
 const l=lessons[state.lesson];

 document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{state.stage=b.dataset.stage;renderLesson();$('lesson-content').setAttribute('tabindex','-1');$('lesson-content').focus();}));
 $('prev-lesson').addEventListener('click',()=>openLesson(state.lesson-1));$('next-lesson').addEventListener('click',()=>openLesson(state.lesson+1));

 $('next-stage').addEventListener('click',()=>{state.stage=state.stage==='teach'?'example':'practice';renderLesson();$('lesson-content').setAttribute('tabindex','-1');$('lesson-content').focus();});

function answerMarkup(q,id,name=id,value=''){
 if(q.options)return `<fieldset style="border:0;padding:0;margin:0"><legend class="small muted">Scegli una risposta</legend><div class="choices">${q.options.map((v,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i}" ${String(value)===String(i)?'checked':''}><span>${v}</span></label>`).join('')}</div></fieldset>`;
 return `<div class="field answer"><label for="${id}">La tua risposta${q.unit?' (in '+q.unit+')':''}</label><input id="${id}" inputmode="${q.answer<0?'text':'decimal'}" autocomplete="off" value="${esc(value)}" placeholder="Scrivi il numero"><span class="small muted">${q.unit?'L’unità richiesta è '+q.unit+'. Inserisci solo il numero.':'Usa la virgola o il punto per i decimali.'}</span></div>`;
}
function readAnswer(q,id,name=id){return q.options?document.querySelector(`input[name="${name}"]:checked`)?.value??'':$(id).value;}
function correct(q,value){return q.options?String(value)===String(q.answer):near(parse(value),q.answer);}
function renderPractice(){
 const l=lessons[state.lesson],q=l.qs[state.q],key=`${state.lesson}-${state.q}`;let rec=state.records[key];

 $('lesson-content').innerHTML=`<p class="eyebrow">${state.q===0?'Applica l’idea':'Cambia situazione'} · prova ${state.q+1} di ${l.qs.length}</p><h2>${q.prompt}</h2><p class="small muted">Prova prima senza aiuti. Puoi spiegare a voce o scrivere una breve frase.</p>${answerMarkup(q,'answer','answer',rec.value)}<div class="actions"><button id="check" class="primary">Controlla</button><button id="hint">Un indizio</button><button id="model">Rivedi l’esempio</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="hint-box" class="banner" hidden></div><div id="solution" class="concept" hidden></div><div class="practice-note"><p><strong>Spiega il ragionamento:</strong> ${q.why}</p><div class="field"><label for="explain">La tua spiegazione, se vuoi scriverla</label><textarea id="explain" placeholder="Puoi anche rispondere a voce.">${esc(state.notes[key]||'')}</textarea></div></div><div class="actions"><button id="other-q">${state.q===0?'Un’altra prova →':'← Torna alla prima prova'}</button><button id="solution-button" ${rec.attempts<2&&!rec.correct?'hidden':''}>Mostra la soluzione</button></div><p id="attempt-note" class="small muted"></p>`;
 const status=()=>{$('attempt-note').textContent=`${rec.attempts?'Tentativi: '+rec.attempts+'. ':''}${rec.help?'Indizio aperto. ':''}${rec.model?'Esempio o soluzione consultati. ':''}${rec.first===true?'Prima risposta corretta'+(rec.firstHelp?' dopo un aiuto.':' prima degli aiuti.'):rec.first===false?'Prima risposta da rivedere.':''}`;};status();
 $('lesson-content').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{rec.value=readAnswer(q,'answer');}));
 $('explain').addEventListener('input',()=>{state.notes[key]=$('explain').value;});
 $('check').addEventListener('click',()=>{
  const value=readAnswer(q,'answer');if(value===''||(!q.options&&!Number.isFinite(parse(value)))){$('feedback').className='feedback';$('feedback').textContent='Inserisci una risposta valida prima di controllare.';return;}
  const ok=correct(q,value);rec.value=value;rec.attempts++;if(rec.first===null){rec.first=ok;rec.firstHelp=rec.help||rec.model;}rec.correct=ok;
  $('feedback').className='feedback'+(ok?' good':'');$('feedback').textContent=ok?`Corretto. ${q.solution}`:'La risposta non torna ancora. Controlla il valore delle cifre, l’operazione e l’unità; puoi aprire un indizio e riprovare.';
  $('solution-button').hidden=!(rec.attempts>=2||ok);status();nav();
 });
 $('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click();});
 $('hint').addEventListener('click',()=>{rec.help=true;$('hint-box').hidden=false;$('hint-box').textContent=q.hint;status();});
 $('model').addEventListener('click',()=>{rec.model=true;state.stage='example';renderLesson();});
 $('solution-button').addEventListener('click',()=>{rec.model=true;$('solution').hidden=false;$('solution').textContent=q.solution;status();});
 $('other-q').addEventListener('click',()=>{rec.value=readAnswer(q,'answer');state.q=1-state.q;renderPractice();$('lesson-content').focus();});
}

function worksheetCorrect(q,value){
 if(q.type==='choice')return String(value)===String(q.answer);
 if(q.type==='number'){const n=parse(value);return Number.isFinite(n)&&Math.abs(n-q.answer)<=Math.max(q.tolerance,Math.abs(q.answer)*1e-10);}
 const a=parse(value.a),n=parse(value.n),o=parse(value.order);

}

   if(a<1||a>=10)feedback('La scrittura non è normalizzata: il coefficiente deve essere almeno 1 e minore di 10. Se cambi il coefficiente, adegua anche l’esponente.');
   else if(Math.abs(a-q.a)>Math.max(q.tolerance,1e-9))feedback('Rivedi il coefficiente: conserva le cifre significative del numero e porta la virgola dopo la prima cifra non nulla.');
   else if(n!==q.n)feedback('Il coefficiente torna, ma l’esponente va rivisto. Conta i posti della virgola e controlla il segno.');
   else if(q.order&&o!==q.n+(q.a>=5?1:0))feedback('La notazione scientifica è corretta. Per l’ordine di grandezza usa la soglia 5: se a ≥ 5 aggiungi 1 all’esponente, anche quando è negativo.');
  }else feedback('Il risultato non torna ancora. Controlla il dato nella tabella, la formula scelta e le unità. Puoi aprire un indizio e riprovare.');
  $('sheet-solution').hidden=!(r.attempts>=2||r.correct||r.shown);status();
 });
 $('sheet-hint').addEventListener('click',()=>{if(r.hints<q.hints.length)r.hints++;$('sheet-hints').hidden=false;$('sheet-hints').innerHTML=q.hints.slice(0,r.hints).map((h,i)=>`<p><strong>Indizio ${i+1}.</strong> ${h}</p>`).join('');status();});
 $('sheet-solution').addEventListener('click',()=>{r.shown=true;$('sheet-worked').hidden=false;$('sheet-worked').textContent=q.solution;status();});
}

const materialState={mode:'volume',a:12,b:10,volume:100,volumeUnit:'cm3',mass:100,massUnit:'g',edge:3,preset:null,modified:false,prediction:'',observation:'',returnTo:null};
const materialUnits={cm3:{label:'cm³',factor:1,min:.001,max:1000,step:.001},L:{label:'L',factor:1000,min:.001,max:100,step:.001},m3:{label:'m³',factor:1000000,min:.000001,max:.1,step:.000001},g:{label:'g',factor:1,min:.001,max:1000,step:.001},kg:{label:'kg',factor:1000,min:.001,max:100,step:.001}};
const materialFmt=n=>n.toLocaleString('it-IT',{useGrouping:false,maximumSignificantDigits:6});
function materialConfig(s){
 const base=s.mode==='cube'?{label:'cm',factor:1,min:.1,max:10,step:.1}:materialUnits[s.mode==='mass'?s.massUnit:s.volumeUnit];
 const value=s.mode==='cube'?s.edge:s.mode==='mass'?s.mass:s.volume;
 // Cambiando unità si conserva la quantità fisica, anche se supera la scala iniziale.
 return {...base,min:Math.min(base.min,value),max:Math.max(base.max,value>base.max?10**Math.ceil(Math.log10(value)):base.max),value};
}
function materialModel(s){
 const fixedMass=s.mode==='mass',volume=s.mode==='cube'?s.edge**3:s.volume*materialUnits[s.volumeUnit].factor,mass=s.mass*materialUnits[s.massUnit].factor;
 const make=i=>{const row=densityRows[i],d=parse(row[2]);return {name:row[0],state:row[1],d,si:parse(row[3]),volume:fixedMass?mass/d:volume,mass:fixedMass?mass:d*volume};};
 return {a:make(s.a),b:make(s.b),fixedMass,mode:s.mode};
}
function materialPreset(key){
 materialState.preset=key;materialState.modified=false;
 if(key==='cube')Object.assign(materialState,{mode:'cube',a:12,b:11,edge:3});
 if(key==='ingots')Object.assign(materialState,{mode:'volume',a:14,b:11,volume:400,volumeUnit:'cm3'});
 if(key==='aquarium')Object.assign(materialState,{mode:'mass',a:7,b:4,mass:61.8,massUnit:'kg'});
}
function materialScientific(n,unit){
 let exponent=Math.floor(Math.log10(n)),coefficient=Number((n/10**exponent).toPrecision(6));if(coefficient>=10){coefficient=1;exponent++;}
 return `${materialFmt(coefficient)} × ${power(exponent)} ${unit}`;
}
function openMaterialLab(fromProblem=false){
 if(fromProblem){sheetRecord(`p${sheetState.problem}-${sheetState.step}`).explorer=true;materialState.returnTo={problem:sheetState.problem,step:sheetState.step};materialPreset(['cube','ingots','aquarium'][sheetState.problem]);}else materialState.returnTo=null;

}
function materialSelect(letter,index){return `<div class="material-picker"><label for="material-${letter}">Materiale ${letter.toUpperCase()}</label><select id="material-${letter}">${densityRows.map((r,i)=>`<option value="${i}" ${index===i?'selected':''}>${r[0]} · ${r[2]} g/cm³</option>`).join('')}</select><label for="material-slider-${letter}" class="small muted">Scorri la tabella per il materiale ${letter.toUpperCase()}</label><input id="material-slider-${letter}" type="range" min="0" max="16" step="1" value="${index}"><span id="material-density-${letter}" class="small"></span></div>`;}
function renderMaterialLab(){
 const s=materialState,c=materialConfig(s),isMass=s.mode==='mass',isCube=s.mode==='cube',unitOptions=isMass?['g','kg']:['cm3','L','m3'];
 $('worksheet-content').innerHTML=`<section class="content"><p class="eyebrow">Prevedi → muovi → osserva → spiega</p><h2>Materiali in movimento</h2><p>Scegli due materiali della scheda e cambia <strong>${isCube?'lo spigolo del cubo':isMass?'la massa comune':'il volume comune'}</strong>. La densità di ciascun materiale resta quella della tabella.</p><div class="material-presets" aria-label="Ritrova i casi della scheda">${[['cube','Il cubetto'],['ingots','I lingotti'],['aquarium','L’acquario']].map(([key,label])=>`<button data-material-preset="${key}" aria-pressed="${s.preset===key&&!s.modified}">${label}</button>`).join('')}</div><div id="material-source" class="banner"></div><div class="field section"><label for="material-mode">Che cosa vuoi confrontare?</label><select id="material-mode"><option value="volume" ${s.mode==='volume'?'selected':''}>Stesso volume → confronto le masse</option><option value="mass" ${s.mode==='mass'?'selected':''}>Stessa massa → confronto i volumi</option><option value="cube" ${s.mode==='cube'?'selected':''}>Due cubi uguali → cambio lo spigolo</option></select></div><div class="material-pickers">${materialSelect('a',s.a)}${materialSelect('b',s.b)}</div><p class="small muted">Le 17 posizioni degli slider corrispondono alle righe della tabella, ordinate per densità. Le distanze tra le posizioni non rappresentano differenze uguali di densità.</p><section class="material-variable"><div class="field"><label for="material-quantity-slider">${isCube?'Spigolo comune l':isMass?'Massa comune m':'Volume comune V'}: <output id="material-quantity-output"></output></label><input id="material-quantity-slider" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"><span class="small muted">Scala: da ${materialFmt(c.min)} a ${materialFmt(c.max)} ${c.label}. Usa anche le frecce della tastiera.</span></div><div class="lab-controls"><div class="field"><label for="material-quantity">Oppure scrivi il valore esatto</label><input id="material-quantity" inputmode="decimal" autocomplete="off" value="${esc(materialFmt(c.value))}"></div>${isCube?'<p class="small muted">Lo spigolo è in cm. Il volume viene calcolato in cm³: l × l × l.</p>':`<div class="field"><label for="material-unit">Unità della quantità comune</label><select id="material-unit">${unitOptions.map(key=>`<option value="${key}" ${key===(isMass?s.massUnit:s.volumeUnit)?'selected':''}>${materialUnits[key].label}</option>`).join('')}</select></div>`}</div><p id="material-error" class="feedback" role="status"></p><div class="actions"><button id="material-half">Dimezza ${isCube?'lo spigolo':isMass?'la massa':'il volume'}</button><button id="material-double">Raddoppia ${isCube?'lo spigolo':isMass?'la massa':'il volume'}</button></div></section><div id="material-results"><p id="material-live" class="small muted" role="status" aria-live="polite"></p><div id="material-cards" class="cards section"></div><div id="material-interpretation" class="concept"></div><figure class="figure material-graph"><div id="material-plot"></div><figcaption id="material-caption"></figcaption></figure></div></section><section class="content section"><h2>Ora spiega quello che hai visto</h2><p id="material-question"></p><div class="field"><label for="material-prediction">La mia previsione (prima di muovere)</label><textarea id="material-prediction">${esc(s.prediction)}</textarea></div><div class="field section"><label for="material-observation">Che cosa cambia? Che cosa resta uguale? Perché?</label><textarea id="material-observation">${esc(s.observation)}</textarea></div><p class="small muted">In coppia: uno prevede e spiega, l’altro muove gli slider; poi scambiate i ruoli. Per verificare l’apprendimento, ricostruite un caso diverso su carta. Qui i valori sono visibili: se usi il laboratorio per un esercizio, annota questo aiuto.</p><div class="actions"><button id="material-print">Stampa il confronto e gli appunti</button><button id="material-back">Torna ai problemi guidati</button><button data-lesson="9">Riprendi il significato della densità</button></div></section>${detail('Che cosa rappresenta il modello?','<p>I calcoli usano le densità approssimate della scheda per campioni omogenei, mantenendo le condizioni del materiale. Il ghiaccio è considerato solido. Non simuliamo variazioni di temperatura, porosità o composizione. Scegliere un’altra posizione dello slider significa scegliere un altro materiale della tabella.</p><p>Per aria e materiali molto più densi, una delle linee può essere molto vicina all’asse: il rapporto è realmente molto piccolo. Leggi anche i valori nei riquadri. Le linee hanno una scala comune dichiarata; lo zero serve come origine del grafico, non come campione da misurare.</p>')}`;
 $('material-quantity-slider').step='any';
 $('material-quantity-slider').after($('material-live'));
 document.querySelectorAll('[data-material-preset]').forEach(b=>b.addEventListener('click',()=>{materialPreset(b.dataset.materialPreset);renderMaterialLab();$('worksheet-content').focus();}));
 $('material-mode').addEventListener('change',()=>{s.mode=$('material-mode').value;s.modified=true;renderMaterialLab();});
 ['a','b'].forEach(letter=>{
  const change=value=>{s[letter]=Number(value);s.modified=true;$('material-'+letter).value=value;$('material-slider-'+letter).value=value;updateMaterialLab(c);};
  $('material-'+letter).addEventListener('change',()=>change($('material-'+letter).value));
  $('material-slider-'+letter).addEventListener('input',()=>change($('material-slider-'+letter).value));
 });
 const assign=value=>{s[isCube?'edge':isMass?'mass':'volume']=value;s.modified=true;};
 const setValue=value=>{assign(value);$('material-quantity').value=materialFmt(value);$('material-quantity-slider').value=String(value);$('material-error').textContent='';$('material-results').hidden=false;updateMaterialLab(c);};
 $('material-quantity-slider').addEventListener('input',()=>setValue(Number($('material-quantity-slider').value)));
 $('material-quantity').addEventListener('input',()=>{const value=parse($('material-quantity').value);if(!Number.isFinite(value)||value<c.min||value>c.max){$('material-error').textContent=`Inserisci un valore tra ${materialFmt(c.min)} e ${materialFmt(c.max)} ${c.label}. I risultati sono nascosti finché il dato non è valido.`;$('material-results').hidden=true;return;}assign(value);$('material-quantity-slider').value=String(value);$('material-error').textContent='';$('material-results').hidden=false;updateMaterialLab(c);});
 $('material-half').addEventListener('click',()=>setValue(Math.max(c.min,materialConfig(s).value/2)));
 $('material-double').addEventListener('click',()=>setValue(Math.min(c.max,materialConfig(s).value*2)));
 if(!isCube)$('material-unit').addEventListener('change',()=>{const key=isMass?'massUnit':'volumeUnit',valKey=isMass?'mass':'volume',oldUnit=materialUnits[s[key]],newKey=$('material-unit').value;s[valKey]=s[valKey]*oldUnit.factor/materialUnits[newKey].factor;s[key]=newKey;renderMaterialLab();});
 $('material-prediction').addEventListener('input',()=>{s.prediction=$('material-prediction').value;});$('material-observation').addEventListener('input',()=>{s.observation=$('material-observation').value;});
 $('material-print').addEventListener('click',()=>window.print());if(s.returnTo)$('material-back').textContent='Torna al passaggio aperto';$('material-back').addEventListener('click',()=>{if(s.returnTo)Object.assign(sheetState,s.returnTo);else{sheetState.problem=s.preset==='ingots'?1:s.preset==='aquarium'?2:0;sheetState.step=0;}worksheetGo('problems');});
 updateMaterialLab(c);bindRoutes();
}
function updateMaterialLab(c){
 const s=materialState,m=materialModel(s),massUnit=m.fixedMass?s.massUnit:s.mode==='cube'||s.volumeUnit==='cm3'?'g':'kg',volumeUnit=m.fixedMass?(s.massUnit==='g'?'cm3':'L'):s.mode==='cube'?'cm3':s.volumeUnit,mf=materialUnits[massUnit].factor,vf=materialUnits[volumeUnit].factor;
 const opened=['a','b'].map(letter=>document.getElementById('material-scientific-'+letter)?.open||false);
 $('material-quantity-output').textContent=`${materialFmt(materialConfig(s).value)} ${c.label}`;
 $('material-quantity-slider').setAttribute('aria-valuetext',`${materialFmt(materialConfig(s).value)} ${c.label}`);
 ['a','b'].forEach(letter=>{const item=m[letter];$('material-density-'+letter).textContent=`${item.state} · d = ${materialFmt(item.d)} g/cm³ = ${materialFmt(item.si)} kg/m³`;$('material-slider-'+letter).setAttribute('aria-valuetext',`${item.name}, densità ${materialFmt(item.d)} grammi per centimetro cubo`);});
 $('material-source').innerHTML=s.preset?`<p><strong>${s.modified?'Hai modificato il caso iniziale. ':''}Riferimento della scheda:</strong> ${s.preset==='cube'?'spigolo 3,0 cm e massa 242 g. Il rame della tabella (8,96 g/cm³) dà 241,92 g per 27 cm³: i 242 g sono coerenti con l’arrotondamento.':s.preset==='ingots'?'400 cm³ di piombo hanno massa 4520 g = 4,52 kg; allo stesso volume il ferro ha massa 3148 g = 3,148 kg.':'61,8 kg di acqua di mare occupano 60 L = 0,06 m³. La stessa massa di olio occupa circa 67,2 L. Muovi la massa comune e confronta i due volumi.'}</p>`:'<p><strong>Prima prevedi:</strong> quale materiale avrà più massa a volume uguale? Quale occuperà più volume a massa uguale? Poi verifica muovendo gli slider.</p>';
 document.querySelectorAll('[data-material-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.materialPreset===s.preset&&!s.modified)));
 $('material-cards').innerHTML=['a','b'].map((letter,i)=>{const r=m[letter],dm=massUnit==='kg'?r.si:r.d,vm=massUnit==='kg'?r.volume/1e6:r.volume,du=massUnit==='kg'?'kg/m³':'g/cm³',mu=materialUnits[massUnit].label,vu=materialUnits[volumeUnit].label;
  return `<article class="card material-card material-${letter}"><p class="eyebrow">Campione ${letter.toUpperCase()} · ${r.state}</p><h3>${r.name}</h3><dl class="material-values"><div><dt>Densità (resta costante)</dt><dd>${materialFmt(r.d)} g/cm³</dd></div><div><dt>Massa${m.fixedMass?' comune':''}</dt><dd>${materialFmt(r.mass/mf)} ${mu}</dd></div><div><dt>Volume${m.fixedMass?'':' comune'}</dt><dd>${materialFmt(r.volume/vf)} ${vu}</dd></div></dl><p class="small"><strong>${m.fixedMass?'V = m / d':'m = d × V'}</strong><br>${m.fixedMass?`${materialFmt(r.mass/mf)} ${mu} ÷ ${materialFmt(dm)} ${du} ≈ ${materialFmt(massUnit==='kg'?r.volume/1e6:r.volume)} ${massUnit==='kg'?'m³':'cm³'}`:`${materialFmt(dm)} ${du} × ${materialFmt(vm)} ${massUnit==='kg'?'m³':'cm³'} ≈ ${materialFmt(r.mass/mf)} ${mu}`}</p>${m.fixedMass&&volumeUnit==='L'?`<p class="small">${materialFmt(r.volume/1e6)} m³ × 1000 ≈ ${materialFmt(r.volume/1000)} L.</p>`:''}<details id="material-scientific-${letter}" ${opened[i]?'open':''}><summary>Leggi anche in notazione scientifica</summary><div class="small"><p>d = ${materialScientific(r.si,'kg/m³')}</p><p>m ≈ ${materialScientific(r.mass/1000,'kg')}</p><p>V ≈ ${materialScientific(r.volume/1e6,'m³')}</p></div></details></article>`;}).join('');
 const equal=Math.abs(m.a.d-m.b.d)<1e-12,denser=m.a.d>m.b.d?m.a:m.b,lighter=m.a.d>m.b.d?m.b:m.a;
 $('material-interpretation').innerHTML=`<p><strong>${equal?'Le densità sono uguali nella tabella.':m.fixedMass?`A massa uguale, ${lighter.name.toLowerCase()} occupa più volume.`:`A volume uguale, ${denser.name.toLowerCase()} ha più massa.`}</strong> ${equal?'In questo modello anche le masse a volume uguale, o i volumi a massa uguale, coincidono. Questo non basta per dire che si tratta dello stesso materiale.':m.fixedMass?'Una densità minore significa meno massa per ogni unità di volume: per contenere la stessa massa serve più volume.':'Una densità maggiore significa più massa per ogni unità di volume.'}</p><p>${s.mode==='cube'?`V = l³ = ${materialFmt(s.edge)} × ${materialFmt(s.edge)} × ${materialFmt(s.edge)} ≈ ${materialFmt(s.edge**3)} cm³. Raddoppiando lo spigolo, volume e massa diventano otto volte maggiori.`:m.fixedMass?'Raddoppiando la massa comune, entrambi i volumi raddoppiano. Le densità non cambiano.':'Raddoppiando il volume comune, entrambe le masse raddoppiano. Le densità non cambiano.'}</p>`;
 $('material-live').textContent=`${m.a.name}: ${materialFmt(m.a.mass/mf)} ${materialUnits[massUnit].label}, ${materialFmt(m.a.volume/vf)} ${materialUnits[volumeUnit].label}. ${m.b.name}: ${materialFmt(m.b.mass/mf)} ${materialUnits[massUnit].label}, ${materialFmt(m.b.volume/vf)} ${materialUnits[volumeUnit].label}.`;
 $('material-question').textContent=s.mode==='cube'?'Prevedi che cosa succede raddoppiando lo spigolo. Il volume diventa doppio oppure otto volte maggiore? Controlla senza cambiare materiale.':m.fixedMass?'Lascia la massa uguale nei due campioni e scegli materiali diversi. Perché il campione meno denso richiede più volume? Poi raddoppia la massa.':'Lascia il volume uguale nei due campioni e scegli materiali diversi. Perché le masse sono diverse? Poi raddoppia il volume senza cambiare materiale.';
 renderMaterialPlot(m,c,massUnit,volumeUnit);
}
function materialPlotData(m,c,massUnit,volumeUnit){
 const fixed=m.fixedMass,xmax=c.max*(m.mode==='cube'?c.max*c.max:1),mf=materialUnits[massUnit].factor,vf=materialUnits[volumeUnit].factor;
 const x=fixed?m.a.mass/mf:m.a.volume/vf;
 const slopes=[m.a,m.b].map(r=>fixed?mf/r.d/vf:vf*r.d/mf);
 return {x,xmax,ymax:xmax*Math.max(...slopes),slopes,y:slopes.map(k=>k*x)};
}
function renderMaterialPlot(m,c,massUnit,volumeUnit){
 const d=materialPlotData(m,c,massUnit,volumeUnit),xunit=m.fixedMass?materialUnits[massUnit].label:materialUnits[volumeUnit].label,yunit=m.fixedMass?materialUnits[volumeUnit].label:materialUnits[massUnit].label,px=x=>62+292*x/d.xmax,py=y=>190-160*y/d.ymax;
 const tick=n=>n>=1e6||n>0&&n<.001?n.toExponential(1).replace('.',','):materialFmt(n);
 $('material-plot').innerHTML=`<svg viewBox="0 0 400 240" role="img" aria-label="${m.fixedMass?'Volume in funzione della massa':'Massa in funzione del volume'}; due materiali a confronto, con linee e punti sulla stessa scala."><path d="M62 30V190H354" fill="none" stroke="#506472" stroke-width="2"/>${[.5,1].map(f=>`<path d="M62 ${py(d.ymax*f)}H354" stroke="#d3dddf"/><text x="55" y="${py(d.ymax*f)+5}" text-anchor="end" font-size="13" fill="#506472">${tick(d.ymax*f)}</text>`).join('')}<text x="53" y="209" font-size="14" fill="#182c3c">0</text><text x="${px(d.xmax/2)}" y="209" text-anchor="middle" font-size="14" fill="#182c3c">${tick(d.xmax/2)}</text><text x="354" y="209" text-anchor="end" font-size="14" fill="#182c3c">${tick(d.xmax)}</text><text x="62" y="20" font-size="15" fill="#182c3c">${m.fixedMass?'Volume':'Massa'} (${yunit})</text><text x="354" y="233" text-anchor="end" font-size="15" fill="#182c3c">${m.fixedMass?'Massa':'Volume'} (${xunit})</text><path d="M62 190L354 ${py(d.slopes[0]*d.xmax)}" stroke="#235cad" stroke-width="3" fill="none"/><path d="M62 190L354 ${py(d.slopes[1]*d.xmax)}" stroke="#126958" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M${px(d.x)} 190V${py(Math.max(...d.y))}" stroke="#a8bac1" stroke-dasharray="3 4"/><circle cx="${px(d.x)}" cy="${py(d.y[0])}" r="5" fill="#fff" stroke="#235cad" stroke-width="3"/><rect x="${px(d.x)-5}" y="${py(d.y[1])-5}" width="10" height="10" fill="#fff" stroke="#126958" stroke-width="3"/></svg>`;
 $('material-caption').innerHTML=`<strong>A: linea continua e cerchio · B: linea tratteggiata e quadrato.</strong> Le due linee hanno la stessa scala; i punti mostrano i valori attuali. ${materialState.mode==='cube'?'Qui l’asse orizzontale è il volume l³, non lo spigolo.':''} Valori calcolati dalla tabella e mostrati con al massimo sei cifre significative.`;
}
