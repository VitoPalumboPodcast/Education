mmary{font-weight:750;cursor:pointer;padding:13px 0}details>div{padding:4px 0 17px}.table-wrap{overflow:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:.9em}caption{text-align:left;font-weight:750;margin-bottom:10px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{background:#eef3f1}.lab-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}.field{display:grid;gap:6px;min-width:0}.field label{font-weight:700;font-size:.9em}input:not([type=radio]),select,textarea{width:100%;max-width:100%;border:1.5px solid #a8bac1;border-radius:9px;background:white;padding:10px 12px;min-height:48px}input[type=range]{padding:0;accent-color:var(--teal)}textarea{min-height:90px;resize:vertical}.answer{max-width:480px;margin-top:16px}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);padding:12px 15px;border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:var(--blue);background:var(--soft)}.choice input{width:20px;height:20px;flex-shrink:0;accent-color:var(--blue)}.feedback{margin:18px 0;border-left:4px solid #8a590b;border-radius:0 12px 12px 0;background:var(--bad);padding:16px 20px}.feedback.good{border-color:var(--teal);background:var(--ok)}.feedback:empty{display:none}.practice-note{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}.lesson-bottom{display:flex;justify-content:space-between;gap:15px;margin:22px 0}.lesson-bottom button{max-width:60%;text-align:left}.status-dot{font-size:12px;color:var(--teal);font-weight:750}.result-item{border-bottom:1px solid var(--line);padding:17px 0}.footer{font-size:12px;color:var(--muted);margin-top:30px;line-height:1.6}.focus .sidebar{display:none}.focus .shell{display:block;max-width:940px}.focus .mobile-menu{display:none}.focus .hero-art{display:none}.focus .hero-layout{grid-template-columns:1fr}.text-large{--text:21px}.text-large .nav-btn{font-si <script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse = value => {const s=String(value).trim().replace('−','-').replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;};
const fmt = n => Math.abs(n)>0&&Math.abs(n)<1e-15 ? n.toExponential(6).replace('.',',').replace('e',' × 10^') : n.toLocaleString('it-IT',{useGrouping:false,maximumFractionDigits:15});
const near = (a,b) => Number.isFinite(a)&&Math.abs(a-b)<Math.max(1e-10,Math.abs(b)*1e-8);
const power = n => `10<sup>${n<0?'−'+Math.abs(n):n}</sup>`;
const callout = s => `<div class="concept">${s}</div>`;
const equation = s => `<div class="formula">${s}</div>`;
const table = (caption,heads,rows) => `<div class="table-wrap"><table><caption>${caption}</caption><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const detail = (title,body) => `<details><summary>${title}</summary><div>${body}</div></details>`;
const numeric = (prompt,answer,unit,hint,solution,why) => ({prompt,answer,unit,hint,solution,why});
const choice = (prompt,options,answer,hint,solution,why) => ({prompt,options,answer,hint,solution,why});
const lessons = [
{id:'misura',title:'Misurare: numero e unità',group:'Partire dal concreto',goal:'Scegliere lo strumento e comunicare una misura completa.',need:'Puoi iniziare qui: servono solo il conteggio e l’osservazione.',
teach:`<h2>Che cosa vuole sapere la fisica?</h2><p>La fisica studia i fenomeni naturali: come si muove un oggetto, quanto dura un evento, come cambia la temperatura. Per confrontare le osservazioni usiamo <strong>grandezze misurabili</strong>.</p><p>La lunghezza è una grandezza. Un righello è uno strumento. Il centimetro è un’unità: una quantità scelta come riferimento. Sono tre cose diverse.</p>${callout('<p><strong>Misurare significa confrontare con un’unità.</strong> Dire «12» non basta: 12 cm e 12 m sono lunghezze diverse.</p>')}${equation('lunghezza = 12,4 cm')}<p>In questa scrittura <strong>12,4 è il numero</strong> e <strong>cm è il simbolo dell’unità</strong>. La misura racconta entrambe le informazioni.</p><h3>Come usare il righello</h3><ol class="steps"><li>Metti l’inizio dell’oggetto sulla <strong>tacca 0</strong>, che può essere diversa dal bordo del righello.</li><li>Allinea il righello al bordo dell’oggetto e osserva dall’alto.</li><li>Leggi la tacca all’altro estremo e scrivi numero e unità.</li></ol><div id="teaching-visual"></div>${detail('Le grandezze fondamentali del SI',`<p>Il Sistema Internazionale (SI) è il linguaggio comune delle unità. Per iniziare useremo soprattutto lunghezza, massa e tempo.</p>${table('Sette grandezze fondamentali',['Grandezza','Unità','Simbolo'],[['Lunghezza','metro','m'],['Massa','chilogrammo','kg'],['Tempo','secondo','s'],['Temperatura termodinamica','kelvin','K'],['Corrente elettrica','ampere','A'],['Quantità di sostanza','mole','mol'],['Intensità luminosa','candela','cd']])}`)}${callout('<p>Due persone possono ottenere letture leggermente diverse. Nessuno strumento fornisce una misura infinitamente precisa. Il protocollo rende le misure confrontabili, non necessariamente identiche.</p>')}`,
example:`<h2>Leggere i millimetri</h2><p>Una striscia parte dalla tacca 0. Finisce quattro tacche piccole dopo 12 cm. Tra 12 e 13 cm ci sono dieci intervalli uguali.</p><ol class="steps"><li>Ogni intervallo piccolo è 1 mm = 0,1 cm.</li><li>Quattro intervalli corrispondono a 4 mm = 0,4 cm.</li><li>Aggiungi alla parte intera: 12 cm + 0,4 cm = <strong>12,4 cm</strong>.</li></ol><p>Non aggiungere cifre inventate: il righello non giustifica una scrittura come 12,40000 cm.</p><h3>Prova con un oggetto vero</h3><p>Prendi una striscia di carta. Misurala seguendo le tre istruzioni. Il disegno dell’app è uno schema: le dimensioni sullo schermo dipendono dal dispositivo.</p>`,
visual:'ruler',qs:[choice('Quale coppia è adatta a misurare la durata di una corsa?',['Righello e centimetri','Cronometro e secondi','Bilancia e chilogrammi'],1,'Pensa a quale strumento misura il tempo.','La durata si misura con un cronometro e si può esprimere in secondi.','Spiega perché «secondo» non è il nome dello strumento.'),numeric('Un oggetto va dalla tacca 2 cm alla tacca 9 cm. Quanto è lungo?',7,'cm','La lunghezza è la differenza tra la lettura finale e quella iniziale.','9 cm − 2 cm = 7 cm. Si può misurare anche senza partire da zero, usando la differenza.','Come controlleresti il risultato riposizionando il righello?')]},
{id:'decimali',title:'Decimi, centesimi e virgola',group:'La matematica che serve',goal:'Capire il valore delle cifre, leggere e confrontare decimali.',need:'Saper contare fino a dieci. Riprendi «Misurare» se numero e unità si confondono.',
teach:`<h2>Una parte di un intero</h2><p>Dividi una stessa unità in <strong>10 parti uguali</strong>. Ogni parte è un decimo: si scrive 1/10 oppure 0,1. Cinque parti sono cinque decimi: 5/10 = 0,5, cioè la metà.</p><p>Dividi l’unità in <strong>100 parti uguali</strong>. Ogni parte è un centesimo: 1/100 = 0,01. Un decimo contiene dieci centesimi.</p><div id="teaching-visual"></div>${table('La posizione dà valore alla cifra',['Unità','Decimi','Centesimi','Numero'],[['0','3','5','0,35'],['2','0','4','2,04']])}<p>0,35 = 3 decimi + 5 centesimi. 2,04 = 2 unità + 4 centesimi: lo zero indica che non ci sono decimi.</p>${callout('<p><strong>0,5 = 0,50.</strong> Lo zero aggiunto alla fine della parte decimale non cambia il valore numerico. Per confrontare 0,5 e 0,08 scrivi 0,50 e 0,08: 50 centesimi sono più di 8.</p>')}${detail('Frazione e divisione','<p>La barra in 3/10 significa «diviso»: 3/10 = 3 ÷ 10 = 0,3. Nelle formule di fisica una frazione indica un rapporto, non due numeri separati.</p>')}`,
example:`<h2>Confrontare 0,4 e 0,35</h2><ol class="steps"><li>Usa parti della stessa dimensione: 0,4 = 0,40.</li><li>Confronta 40 centesimi con 35 centesimi.</li><li>40 è maggiore di 35, quindi <strong>0,4 &gt; 0,35</strong>.</li></ol><p>Non contare le cifre: avere più cifre dopo la virgola non significa avere un numero più grande.</p>${equation('0,4 m = 40 cm &nbsp; · &nbsp; 0,35 m = 35 cm')}`,
visual:'decimals',qs:[numeric('Scrivi come numero decimale 7 centesimi.',.07,'','La prima posizione dopo la virgola è quella dei decimi; la seconda è quella dei centesimi.','7/100 = 0,07. Lo zero dei decimi mantiene il 7 nella posizione dei centesimi.','Qual è la differenza tra 0,7 e 0,07?'),choice('Quale numero è maggiore?',['0,09','0,8','Sono uguali'],1,'Confronta le due quantità in centesimi.','0,8 = 0,80. Ottanta centesimi sono più di nove centesimi.','Descrivi il confronto usando parti uguali di una barra.')]},
{id:'operazioni',title:'Moltiplicare e dividere',group:'La matematica che serve',goal:'Dare significato a ×, ÷ e al rapporto «per ogni».',need:'Decimi e centesimi: le cifre cambiano posizione quando cambia il valore.',
teach:`<h2>Due operazioni, due domande</h2><p><strong>Moltiplicare</strong> può significare ripetere una quantità: 4 gruppi da 3 unità fanno 4 × 3 = 12 unità. <strong>Dividere</strong> può significare distribuire in parti uguali: 12 unità divise in 4 gruppi danno 3 unità per gruppo.</p>${equation('12 ÷ 4 = 12/4 = 3')}<p>Controlla la divisione con l’operazione inversa: 3 × 4 = 12. Non si può dividere per zero.</p><h3>Che cosa cambia con 10?</h3>${table('Ogni cifra cambia valore',['Numero iniziale','Operazione','Risultato'],[['0,35','× 10','3,5'],['0,35','÷ 10','0,035'],['24','÷ 100','0,24']])}${callout('<p>Moltiplicare per 10 rende ciascuna cifra dieci volte più importante. Dividere per 10 la rende dieci volte meno importante. La virgola aiuta a rappresentare questo cambiamento; non è uno spostamento senza significato.</p>')}<p>Per × 100 ripeti due volte × 10. Per ÷ 100 ripeti due volte ÷ 10. Anche con i decimali puoi controllare il risultato con l’operazione inversa.</p>${detail('Prima delle formule: il rapporto','<p>Se 20 cubetti uguali hanno una massa totale di 60 g, 60 ÷ 20 = 3 g è la massa <strong>per cubetto</strong>. La parola «per» esprime qui quanta massa corrisponde a una sola unità: è il ponte verso la densità.</p>')}`,
example:`<h2>Da 0,6 a 0,006</h2><ol class="steps"><li>Dividi per 10: 0,6 ÷ 10 = 0,06.</li><li>Dividi ancora per 10: 0,06 ÷ 10 = 0,006.</li><li>Hai diviso per 100. Controlla: 0,006 × 100 = 0,6.</li></ol><h3>Un rapporto concreto</h3><p>Quattro porzioni uguali hanno in tutto una massa di 200 g. Per una porzione: 200 g ÷ 4 = 50 g. Per ritrovare il totale: 50 g × 4 = 200 g.</p>`,
qs:[numeric('Calcola 0,24 ÷ 10.',.024,'','Il risultato deve essere dieci volte più piccolo di 0,24.','0,24 ÷ 10 = 0,024. Controllo: 0,024 × 10 = 0,24.','Perché 2,4 non può essere il risultato?'),numeric('Sei pezzi uguali hanno una massa totale di 90 g. Qual è la massa di un pezzo?',15,'g','Distribuisci la massa totale tra i sei pezzi.','90 g ÷ 6 = 15 g per pezzo. Controllo: 15 × 6 = 90.','Quale informazione del testo permette di usare la divisione?')]},
{id:'potenze',title:'Potenze di dieci',group:'Scrivere e confrontare',goal:'Leggere base ed esponente, anche zero e negativo.',need:'Moltiplicare e dividere per 10.',
teach:`<h2>Una scrittura breve</h2><p>In 10<sup>3</sup>, <strong>10 è la base</strong> e <strong>3 è l’esponente</strong>. Con un esponente intero positivo, ripeti il fattore 10: 10<sup>3</sup> = 10 × 10 × 10 = 1000. Non significa 10 × 3.</p>${table('Un passo di esponente cambia il valore di un fattore 10',['Potenza','Significato','Valore'],[[power(2),'10 × 10','100'],[power(1),'10','10'],[power(0),'il valore da cui parte la sequenza','1'],[power(-1),'1 ÷ 10','0,1'],[power(-2),'1 ÷ 100','0,01'],[power(-3),'1 ÷ 1000','0,001']])}${callout('<p><strong>10<sup>−3</sup> è positivo.</strong> Il meno riguarda l’esponente: indica la divisione per 1000. Per avere un numero negativo serve un meno davanti al valore, come −1000.</p>')}<p>Scendendo di 1 nell’esponente dividi per 10; salendo di 1 moltiplichi per 10. Questo spiega anche perché 10<sup>0</sup> = 1: 10<sup>1</sup> ÷ 10 = 1.</p><div id="teaching-visual"></div>`,
example:`<h2>Leggere 3 × 10<sup>−2</sup></h2><ol class="steps"><li>Interpreta la potenza: 10<sup>−2</sup> = 1/100 = 0,01.</li><li>Moltiplica per 3: 3 × 0,01 = 0,03.</li><li>Il risultato è positivo e minore di 1.</li></ol>${equation('3 × 10<sup>−2</sup> = 0,03')}<p>A parità di coefficiente, 3 × 10<sup>−1</sup> è dieci volte maggiore di 3 × 10<sup>−2</sup>.</p>`,
visual:'powers',qs:[numeric('Quanto vale 10 elevato a zero?',1,'','Segui la sequenza: 100 → 10 → … Ogni volta dividi per 10.','10⁰ = 1, perché 10 ÷ 10 = 1.','Perché l’esponente zero non fa diventare il valore zero?'),numeric('Scrivi in decimale 6 × 10⁻³.',.006,'','Prima interpreta 10⁻³ come un millesimo, poi considera sei millesimi.','10⁻³ = 0,001; 6 × 0,001 = 0,006.','Il meno appartiene al numero o all’esponente?')]},
{id:'scientifica',title:'Notazione scientifica',group:'Scrivere e confrontare',goal:'Passare tra scrittura decimale e a × 10ⁿ mantenendo il valore.',need:'Valore posizionale, potenze di dieci e moltiplicazione.',
teach:`<h2>Lo stesso numero, meno zeri</h2><p>Per numeri positivi, la notazione scientifica ha la forma <strong>a × 10<sup>n</sup></strong>: il coefficiente a è almeno 1 e minore di 10; n è un intero.</p>${equation('4500 = 4,5 × 10<sup>3</sup> &nbsp; · &nbsp; 0,0045 = 4,5 × 10<sup>−3</sup>')}<p>Per 4500 scegli 4,5: per recuperare 4500 devi moltiplicare per 1000. Per 0,0045 scegli ancora 4,5: per recuperare 0,0045 devi dividere per 1000.</p>${callout('<p>La notazione scientifica <strong>non arrotonda</strong> da sola. 4,567 × 10³ = 4567 esattamente; 4,6 × 10³ è invece un valore arrotondato se il dato iniziale è 4567.</p>')}<h3>Controlla tre cose</h3><ol class="steps"><li>Il coefficiente rispetta 1 ≤ a &lt; 10?</li><li>La potenza ricostruisce il valore iniziale?</li><li>Hai mantenuto l’unità, se si tratta di una misura?</li></ol>${detail('Esponente zero, segno e casi speciali','<p>5 = 5 × 10⁰. I numeri tra 1 incluso e 10 escluso hanno esponente zero. Per numeri negativi si usa 1 ≤ |a| &lt; 10, per esempio −450 = −4,5 × 10². Zero si scrive semplicemente 0: non ha un coefficiente normalizzato.</p>')}${detail('Moltiplicare e dividere in notazione scientifica',`<p>Moltiplica i coefficienti e <strong>somma</strong> gli esponenti: (3 × 10²) × (2 × 10³) = 6 × 10⁵.</p><p>Dividi i coefficienti e <strong>sottrai</strong> gli esponenti: (8 × 10⁴) ÷ (2 × 10²) = 4 × 10².</p><p>Se il coefficiente esce dall’intervallo, normalizzalo: 12 × 10³ = 1,2 × 10⁴. Anche le unità partecipano: m × m = m².</p><p>Per somme e differenze porta prima le potenze allo stesso esponente: 2 × 10³ + 3 × 10² = 2 × 10³ + 0,3 × 10³ = 2,3 × 10³.</p>`)}`,
example:`<h2>Una lunghezza di 0,00072 m</h2><ol class="steps"><li>Scegli il coefficiente 7,2, compreso tra 1 e 10.</li><li>Per tornare a 0,00072 devi dividere 7,2 per 10 000: quattro divisioni per 10.</li><li>Scrivi <strong>0,00072 m = 7,2 × 10<sup>−4</sup> m</strong>.</li></ol><p>Controllo: 7,2 × 0,0001 = 0,00072. 72 × 10<sup>−5</sup> ha lo stesso valore, ma non è una scrittura scientifica normalizzata perché 72 è maggiore di 10.</p>`,
qs:[choice('Quale è la notazione scientifica normalizzata di 32 000?',['32 × 10³','3,2 × 10⁴','0,32 × 10⁵'],1,'Le tre scritture hanno lo stesso valore: guarda l’intervallo del coefficiente.','3,2 × 10⁴ è normalizzata. 32 e 0,32 non rispettano 1 ≤ a < 10.','Come ricostruisci 32 000 da 3,2 × 10⁴?'),numeric('Completa l’esponente: 0,0009 m = 9 × 10ⁿ m. Quanto vale n?',-4,'','Quante divisioni per 10 riportano 9 a 0,0009?','9 ÷ 10 000 = 0,0009, quindi n = −4.','Perché l’unità m rimane la stessa?')]},
{id:'conversioni',title:'Cambiare unità: lunghezza e massa',group:'Usare le misure',goal:'Convertire usando il valore delle unità, con un controllo del risultato.',need:'Decimali e moltiplicazione o divisione per 10, 100, 1000.',
teach:`<h2>L’oggetto resta lo stesso</h2><p>Se esprimi una lunghezza in un’unità più piccola, servono più unità per coprirla: il numero aumenta. Se scegli un’unità più grande, il numero diminuisce.</p>${equation('1 m = 10 dm = 100 cm = 1000 mm')}${table('Prefissi che useremo',['Prefisso','Simbolo','Fattore'],[['kilo','k','1000 = '+power(3)],['deci','d','0,1 = '+power(-1)],['centi','c','0,01 = '+power(-2)],['milli','m','0,001 = '+power(-3)],['micro','μ','0,000001 = '+power(-6)],['nano','n','0,000000001 = '+power(-9)]])}<p>Per la massa: <strong>1 kg = 1000 g</strong> e <strong>1 g = 1000 mg</strong>. Il simbolo kg si scrive con lettere minuscole.</p>${callout('<p><strong>Prevedi → usa l’equivalenza → calcola → controlla.</strong> Non scegliere × o ÷ guardando solo la direzione di una freccia: chiediti quanto vale l’unità di partenza nella nuova unità.</p>')}<div id="teaching-visual"></div>`,
example:`<h2>Convertire 0,3 dm in metri</h2><ol class="steps"><li>Il metro è più grande del decimetro: prevedi un numero minore.</li><li>Usa 1 dm = 0,1 m.</li><li>0,3 dm = 0,3 × 0,1 m = <strong>0,03 m</strong>.</li><li>Controllo: 0,03 m × 10 = 0,3 dm.</li></ol><h3>Una massa</h3><p>2,4 kg = 2,4 × 1000 g = 2400 g. Il grammo è più piccolo: lo stesso oggetto è descritto da un numero maggiore.</p>`,
visual:'conversion',qs:[numeric('Converti 35 cm in metri.',.35,'m','Usa 1 cm = 0,01 m.','35 × 0,01 = 0,35, quindi 35 cm = 0,35 m.','Perché il numero diminuisce?'),numeric('Converti 0,08 kg in grammi.',80,'g','Un chilogrammo equivale a 1000 grammi.','0,08 × 1000 = 80, quindi 0,08 kg = 80 g.','Il valore numerico aumenta: la massa è cambiata?')]},
{id:'tempo',title:'Minuti, ore e secondi',group:'Usare le misure',goal:'Convertire intervalli di tempo senza applicare la scala decimale.',need:'Moltiplicazione, divisione e somma.',
teach:`<h2>Qui il fattore non è dieci</h2><p>Il secondo (s) è l’unità SI dell’intervallo di tempo. Un minuto dura 60 secondi; un’ora dura 60 minuti. Le conversioni tra queste unità <strong>non usano fattori di 10</strong>.</p>${equation('1 min = 60 s &nbsp; · &nbsp; 1 h = 3600 s')}<p>Da minuti a secondi moltiplica per 60. Da secondi a minuti dividi per 60. Da ore a secondi moltiplica per 3600.</p>${callout('<p><strong>1,5 min non significa 1 min e 5 s.</strong> 0,5 min è mezzo minuto: 30 s. Quindi 1,5 min = 90 s.</p>')}<h3>Tempi composti</h3><p>Per 2 min e 15 s, converti prima 2 min in 120 s, poi aggiungi 15 s: il totale è 135 s. Somma solo quantità espresse nella stessa unità.</p>${detail('Giorni e anni','<p>Negli esercizi scolastici 1 giorno = 24 h = 86 400 s. Un intervallo di 365 giorni equivale a 31 536 000 s; non tutti gli anni civili hanno 365 giorni.</p>')}`,
example:`<h2>Da 2 h e 10 min a secondi</h2><ol class="steps"><li>Converti le ore: 2 × 3600 s = 7200 s.</li><li>Converti i minuti: 10 × 60 s = 600 s.</li><li>Somma nella stessa unità: 7200 s + 600 s = <strong>7800 s</strong>.</li></ol><p>Controllo: il risultato è maggiore di 7200 s, cioè di due ore.</p>`,
qs:[numeric('Quanti secondi dura un intervallo di 1,5 min?',90,'s','Mezzo minuto dura la metà di 60 s.','1,5 × 60 = 90 s. La parte 0,5 min vale 30 s.','Perché non si moltiplica per 100?'),numeric('Converti 3 min e 20 s in secondi.',200,'s','Converti prima i minuti, poi aggiungi i secondi.','3 × 60 + 20 = 200 s.','Come riconverti 200 s in minuti e secondi?')]},
{id:'volume',title:'Area e volume',group:'Usare le misure',goal:'Distinguere lunghezza, superficie e spazio occupato; capire cm² e cm³.',need:'Moltiplicazione e unità di lunghezza.',
teach:`<h2>Una, due, tre dimensioni</h2><p>La <strong>lunghezza</strong> descrive una distanza. L’<strong>area</strong> descrive una superficie: per un rettangolo A = base × altezza. Il <strong>volume</strong> descrive lo spazio occupato: per un parallelepipedo V = lunghezza × larghezza × altezza.</p>${equation('cm × cm = cm² &nbsp; · &nbsp; cm × cm × cm = cm³')}<p>Un cm² è l’area di un quadrato con lato 1 cm. Un cm³ è il volume di un cubo con lato 1 cm. Area e volume sono grandezze derivate: combinano lunghezze.</p><div id="teaching-visual"></div>${callout('<p>Poiché 1 m = 100 cm, <strong>1 m² = 100 × 100 cm² = 10 000 cm²</strong> e <strong>1 m³ = 100 × 100 × 100 cm³ = 1 000 000 cm³</strong>. Il fattore di conversione va elevato al quadrato o al cubo.</p>')}${table('Volume e litro',['Equivalenza','Significato'],[['1 L = 1 dm³','un cubo di lato 1 dm'],['1 mL = 1 cm³','un cubo di lato 1 cm'],['1 m³ = 1000 L','1000 cubi da 1 dm³']])}<p>Il litro (L) è un’unità di volume ammessa con il SI; l’unità SI del volume è il metro cubo (m³). Il litro è un’unità, non una grandezza.</p>`,
example:`<h2>Una scatola rettangolare</h2><p>Le dimensioni esterne di un blocco pieno sono 4 cm, 3 cm e 2 cm.</p><ol class="steps"><li>Area della base: 4 cm × 3 cm = 12 cm².</li><li>Volume: 12 cm² × 2 cm = <strong>24 cm³</strong>.</li><li>Controllo: il blocco contiene il volume di 24 cubetti da 1 cm³.</li></ol><p>Per un oggetto irregolare puoi misurare l’aumento del livello dell’acqua in un cilindro graduato, se l’oggetto si immerge completamente e non si scioglie: V = lettura finale − lettura iniziale.</p>`,
visual:'volume',qs:[numeric('Un blocco misura 5 cm × 2 cm × 3 cm. Calcola il volume.',30,'cm³','Moltiplica le tre dimensioni.','5 × 2 × 3 = 30 cm³. Le tre unità cm si combinano in cm³.','Come cambierebbe il volume raddoppiando solo una dimensione?'),numeric('Un oggetto immerso porta l’acqua da 40 mL a 57 mL. Qual è il suo volume?',17,'cm³','Calcola solo l’aumento del volume dell’acqua; 1 mL = 1 cm³.','57 − 40 = 17 mL = 17 cm³.','Quali condizioni rendono valida questa misura?')]},
{id:'stima',title:'Uguaglianza, arrotondamento e stima',group:'Scrivere e confrontare',goal:'Distinguere scrittura equivalente, valore arrotondato e ordine di grandezza.',need:'Decimali, notazione scientifica e confronto tra numeri.',
teach:`<h2>Due simboli, due significati</h2><p><strong>=</strong> indica lo stesso valore. <strong>≈</strong> indica un valore approssimato. Devi specificare a quale precisione arrotondi.</p>${equation('0,0008 m = 8 × 10<sup>−4</sup> m<br>0,0008 m ≈ 0,001 m &nbsp; (al millesimo)')}<p>Per arrotondare 1,274 ai centesimi conserva due cifre dopo la virgola. Osserva la terza cifra: è 4, minore di 5. Quindi 1,274 ≈ 1,27. Per 1,278 la terza cifra è 8: aumenta il centesimo e ottieni 1,28.</p>${callout('<p>Un’uguaglianza tra scritture dello stesso dato non afferma che la misura fisica sia priva di incertezza. 12,4 cm = 0,124 m è una conversione esatta del valore comunicato.</p>')}<h3>Ordine di grandezza: dichiariamo la convenzione</h3><p>Nel report della classe si usa questa <strong>regola scolastica di stima</strong>: per a × 10ⁿ, se a &lt; 5 scegli 10ⁿ; se a ≥ 5 scegli 10ⁿ⁺¹. La useremo qui per numeri positivi.</p><p>Per esempio: 3 × 10⁴ ha ordine 10⁴; 8 × 10⁴ ha ordine 10⁵. È una stima della scala, non una scrittura equivalente.</p>${detail('Perché specificare la regola?','<p>In altri testi si usano convenzioni diverse, per esempio una soglia √10 per la vicinanza su scala logaritmica. La soglia 5 del report non coincide con la potenza più vicina in ogni possibile senso matematico. Segui la convenzione dichiarata dal docente e non mescolare le regole.</p>')}`,
example:`<h2>Tre modi di descrivere 0,0008 m</h2><ol class="steps"><li>Scrittura equivalente: <strong>8 × 10⁻⁴ m</strong>, con il segno =.</li><li>Arrotondamento al millesimo di metro: <strong>0,001 m</strong>, con il segno ≈.</li><li>Ordine di grandezza con la regola della classe: 8 ≥ 5, quindi aumenta l’esponente da −4 a −3: <strong>10⁻³ m</strong>.</li></ol><p>In questo esempio le ultime due stime coincidono. Non è una regola generale: arrotondare a una posizione decimale e stimare l’ordine di grandezza sono operazioni diverse.</p>`,
qs:[choice('Completa: 0,006 m … 6 × 10⁻³ m.',['=','≈'],0,'Trasforma la potenza in decimale e confronta.','I valori coincidono: usa =. Qui non hai arrotondato.','Che cosa cambierebbe se scrivessi 0,01 m?'),numeric('Usa la soglia 5 della classe. Per 7 × 10⁻⁵, quale esponente ha l’ordine di grandezza?',-4,'','Poiché 7 ≥ 5, aumenta l’esponente di una unità.','−5 + 1 = −4. L’ordine è 10⁻⁴, non il valore esatto 7 × 10⁻⁵.','Perché −4 è maggiore di −5?')]},
{id:'densita',title:'Densità: massa per volume',group:'Collegare le grandezze',goal:'Capire il rapporto m/V e confrontare corpi senza confondere massa e densità.',need:'Divisione, massa, volume e unità cubiche.',
teach:`<h2>Quanta massa in uno stesso spazio?</h2><p>Due blocchi con lo stesso volume possono avere masse diverse. La <strong>densità</strong> indica quanta massa corrisponde a un’unità di volume.</p>${equation('d = m/V &nbsp; → &nbsp; densità = massa ÷ volume')}<p>m indica la massa del corpo, V il suo volume. Il simbolo m dentro una formula indica una grandezza; m dopo un numero può indicare l’unità metro: leggi il contesto.</p><p>Se un blocco ha massa 60 g e volume 20 cm³, d = 60 ÷ 20 = <strong>3 g/cm³</strong>. Significa: 3 grammi per ogni centimetro cubo.</p><div id="teaching-visual"></div>${callout('<p><strong>Più massa non significa sempre più densità.</strong> Un corpo grande può avere molta massa e poca densità. Per confrontare devi dividere ogni massa per il proprio volume.</p>')}<p>L’unità SI è kg/m³. Puoi usare g/cm³ con dati coerenti: <strong>1 g/cm³ = 1000 kg/m³</strong>. Il volume deve essere maggiore di zero.</p>${detail('Che cosa dice il materiale?','<p>Per lo stesso materiale omogeneo, alle stesse condizioni, raddoppiare massa e volume lascia la densità invariata. La densità può dipendere da temperatura, composizione e porosità. Confrontarla con una tabella aiuta a formulare un’ipotesi, ma da sola non identifica con certezza un materiale. La massa non è il peso: la massa si esprime in kg, il peso è una forza.</p>')}`,
example:`<h2>Due blocchi diversi</h2>${table('Dati didattici, non misure di materiali reali',['Blocco','Massa','Volume','Densità'],[['A','80 g','20 cm³','4 g/cm³'],['B','120 g','60 cm³','2 g/cm³']])}<ol class="steps"><li>Per A: 80 ÷ 20 = 4 g/cm³.</li><li>Per B: 120 ÷ 60 = 2 g/cm³.</li><li>B ha più massa, ma A è più denso: ogni cm³ di A contiene il doppio della massa.</li></ol><p>Controllo delle unità: grammi divisi per centimetri cubi danno g/cm³.</p>`,
visual:'density',qs:[numeric('Un blocco ha massa 84 g e volume 28 cm³. Calcola la densità.',3,'g/cm³','Dividi la massa per il volume.','84 g ÷ 28 cm³ = 3 g/cm³.','Che cosa significa fisicamente il numero 3?'),choice('Dallo stesso materiale omogeneo ricavi un blocco con il doppio del volume e della massa. Alle stesse condizioni, la densità…',['raddoppia','si dimezza','rimane uguale'],2,'Scrivi il nuovo rapporto: (2 × massa)/(2 × volume).','Il fattore 2 si semplifica. La densità rimane uguale.','Perché la densità non dipende dalla quantità di materiale in questo caso?')]},
{id:'inverse',title:'Ricavare massa e volume',group:'Collegare le grandezze',goal:'Scegliere e spiegare una formula inversa, prima di sostituire i numeri.',need:'Densità e operazioni inverse: dividere annulla una moltiplicazione.',
teach:`<h2>Una relazione, tre domande</h2><p>Se conosci massa e volume, trovi la densità. Se conosci densità e volume, trovi la massa. Se conosci massa e densità, trovi il volume.</p>${equation('d = m/V &nbsp; · &nbsp; m = d × V &nbsp; · &nbsp; V = m/d')}<h3>Perché funzionano le formule inverse?</h3><ol class="steps"><li>Parti da d = m/V. Moltiplica entrambi i lati per V: d × V = (m/V) × V = m.</li><li>Hai ottenuto m = d × V.</li><li>Per trovare V, dividi entrambi i lati per d: m/d = (d × V)/d = V.</li></ol>${callout('<p>Un’equazione è un’uguaglianza. Per conservarla, fai la <strong>stessa operazione su entrambi i lati</strong>. Non devi imparare un generico «sposta il numero» senza sapere perché.</p>')}<h3>Prima del calcolo</h3><p>Scrivi i dati con le unità. Nomina l’incognita. Scegli la formula. Controlla che le unità siano coerenti, poi sostituisci i numeri.</p>`,
example:`<h2>Quanto volume occupa?</h2><p>Un blocco ha massa 45 g e densità 3 g/cm³. Devi trovare V.</p><ol class="steps"><li>Dati: m = 45 g, d = 3 g/cm³. Incognita: V.</li><li>Formula: V = m/d.</li><li>Calcolo: 45 ÷ 3 = <strong>15 cm³</strong>.</li><li>Controllo: 3 g/cm³ × 15 cm³ = 45 g.</li></ol><h3>E per trovare la massa?</h3><p>Con d = 2 g/cm³ e V = 8 cm³: m = d × V = 16 g. Ogni cm³ contiene 2 g; otto cm³ contengono 16 g.</p>`,
qs:[numeric('La densità è 4 g/cm³ e il volume è 6 cm³. Qual è la massa?',24,'g','Ripeti 4 g per ciascuno dei sei cm³.','m = d × V = 4 × 6 = 24 g.','Come controlli il risultato con la formula della densità?'),numeric('La massa è 72 g e la densità è 6 g/cm³. Qual è il volume?',12,'cm³','Quanti gruppi da 6 g trovi in 72 g?','V = m/d = 72 ÷ 6 = 12 cm³.','Quali unità avresti dovuto convertire se la massa fosse stata in kg?')]}
];
const state={view:'home',lesson:0,stage:'teach',q:0,records:{},notes:{},diagnostic:{},exam:{}};
const footer=()=>`<footer class="footer">Funziona anche senza rete · Nessun account. Risposte e appunti restano solo nella scheda aperta e si perdono ricaricandola.<br>Materiale didattico da collaudare in classe · Le prove riuscite non certificano da sole l’autonomia.</footer>`;
function nav(){
 const root=$('lesson-nav');root.replaceChildren();
 function add(label,act,current,num){const b=document.createElement('button');b.className='nav-btn';b.type='button';if(current)b.setAttribute('aria-current','page');if(num!==undefined){const n=document.createElement('span');n.className='nav-num';n.textContent=num;b.append(n);}const t=document.createElement('span');t.textContent=label;b.append(t);b.addEventListener('click',act);root.append(b);}
 add('Panoramica',()=>show('home'),state.view==='home');add('Da dove comincio?',()=>show('diagnostic'),state.view==='diagnostic');
 let prev='';lessons.forEach((l,i)=>{if(l.group!==prev){const p=document.createElement('p');p.className='nav-head';p.textContent=l.group;root.append(p);prev=l.group;}const passed=l.qs.every((_,q)=>state.records[`${i}-${q}`]?.correct);add(l.title+(passed?' ✓':''),()=>openLesson(i),state.view==='lesson'&&state.lesson===i,String(i+1).padStart(2,'0'));});
 const p=document.createElement('p');p.className='nav-head';p.textContent='Metti alla prova';root.append(p);add('Laboratorio di classe',()=>show('class'),state.view==='class');add('Un caso nuovo',()=>show('exam'),state.view==='exam');add('Parole e simboli',()=>show('glossary'),state.view==='glossary');
}
function show(view,focus=true){state.view=view;nav();if(view==='home')renderHome();if(view==='lesson')renderLesson();if(view==='diagnostic')renderDiagnostic();if(view==='class')renderClass();if(view==='exam')renderExam();if(view==='glossary')renderGlossary();$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');if(focus){$('main').focus();window.scrollTo({top:0,behavior:'instant'});}}
function openLesson(i,stage='teach'){state.lesson=i;state.stage=stage;state.q=0;show('lesson');}
function bindRoutes(){document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>openLesson(Number(b.dataset.lesson))));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));}

 $('main').innerHTML=`<section class="hero"><div class="hero-layout"><div><p class="eyebrow">Osserva. Capisci. Poi prova.</p><h1>Le basi della fisica,<br>un passo alla volta.</h1><p class="muted">Dalle prime misure alla densità. Costruisci anche la matematica che serve, senza saltare i passaggi.</p><div class="actions"><button class="primary" data-lesson="0">Comincia da una misura →</button><button data-view="diagnostic">Da dove comincio?</button></div><p class="small muted" style="margin:17px 0 0">Undici brevi lezioni · Al tuo ritmo · Da solo o con la classe</p></div><svg class="hero-art" viewBox="0 0 300 260" role="img" aria-label="La stessa lunghezza: 10 centimetri equivalgono a 0,1 metri"><rect x="10" y="18" width="280" height="224" rx="24" fill="#edf4ef"/><path d="M60 80h180" stroke="#245cad" stroke-width="12" stroke-linecap="round"/><path d="M60 96v60 M78 96v20 M96 96v20 M114 96v20 M132 96v20 M150 96v40 M168 96v20 M186 96v20 M204 96v20 M222 96v20 M240 96v60" stroke="#7a9194" stroke-width="2"/><text x="54" y="177" font-size="16" fill="#182c3c">0</text><text x="216" y="177" font-size="16" fill="#182c3c">10 cm</text><text x="65" y="220" font-size="23" font-weight="700" fill="#126958">10 cm = 0,1 m</text></svg></div></section>

function renderLesson(){
 const l=lessons[state.lesson];
 $('main').innerHTML=`<p class="breadcrumb">Lezione ${state.lesson+1} di ${lessons.length} · ${l.group}</p><header class="lesson-top"><div><p class="eyebrow">${l.goal}</p><h1>${l.title}</h1><p class="meta">Prima di iniziare: ${l.need}</p></div><span class="pill">Al tuo ritmo</span></header><nav class="stage-nav" aria-label="Fasi della lezione"><button data-stage="teach" aria-pressed="${state.stage==='teach'}">1 · Capisci</button><button data-stage="example" aria-pressed="${state.stage==='example'}">2 · Esempio</button><button data-stage="practice" aria-pressed="${state.stage==='practice'}">3 · Prova</button></nav><article id="lesson-content" class="content"></article><nav class="lesson-bottom" aria-label="Lezioni vicine"><button id="prev-lesson" ${state.lesson===0?'disabled':''}>← Lezione precedente</button><button id="next-lesson" ${state.lesson===lessons.length-1?'disabled':''}>Lezione successiva →</button></nav>${footer()}`;
 document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{state.stage=b.dataset.stage;renderLesson();$('lesson-content').setAttribute('tabindex','-1');$('lesson-content').focus();}));
 $('prev-lesson').addEventListener('click',()=>openLesson(state.lesson-1));$('next-lesson').addEventListener('click',()=>openLesson(state.lesson+1));
 if(state.stage==='practice'){renderPractice();return;}
 $('lesson-content').innerHTML=(state.stage==='teach'?l.teach:l.example)+`<div class="actions"><button id="next-stage" class="primary">${state.stage==='teach'?'Segui un esempio →':'Ora prova tu →'}</button></div>`;
 $('next-stage').addEventListener('click',()=>{state.stage=state.stage==='teach'?'example':'practice';renderLesson();$('lesson-content').setAttribute('tabindex','-1');$('lesson-content').focus();});
 if(state.stage==='teach'&&l.visual)visual(l.visual);
}
function answerMarkup(q,id,name=id,value=''){
 if(q.options)return `<fieldset style="border:0;padding:0;margin:0"><legend class="small muted">Scegli una risposta</legend><div class="choices">${q.options.map((v,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i}" ${String(value)===String(i)?'checked':''}><span>${v}</span></label>`).join('')}</div></fieldset>`;
 return `<div class="field answer"><label for="${id}">La tua risposta${q.unit?' (in '+q.unit+')':''}</label><input id="${id}" inputmode="${q.answer<0?'text':'decimal'}" autocomplete="off" value="${esc(value)}" placeholder="Scrivi il numero"><span class="small muted">${q.unit?'L’unità richiesta è '+q.unit+'. Inserisci solo il numero.':'Usa la virgola o il punto per i decimali.'}</span></div>`;
}
function readAnswer(q,id,name=id){return q.options?document.querySelector(`input[name="${name}"]:checked`)?.value??'':$(id).value;}
function correct(q,value){return q.options?String(value)===String(q.answer):near(parse(value),q.answer);}
function renderPractice(){
 const l=lessons[state.lesson],q=l.qs[state.q],key=`${state.lesson}-${state.q}`;let rec=state.records[key];
 if(!rec)rec=state.records[key]={attempts:0,help:false,model:false,correct:false,value:'',first:null};
 $('lesson-content').innerHTML=`<p class="eyebrow">${state.q===0?'Applica l’idea':'Cambia situazione'} · prova ${state.q+1} di ${l.qs.length}</p><h2>${q.prompt}</h2><p class="small muted">Prova prima senza aiuti. Puoi spiegare a voce o scrivere una breve frase.</p>${answerMarkup(q,'answer','answer',rec.value)}<div class="actions"><button id="check" class="primary">Controlla</button><button id="hint">Un indizio</button><button id="model">Rivedi l’esempio</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="hint-box" class="banner" hidden></div><div id="solution" class="concept" hidden></div><div class="practice-note"><p><strong>Spiega il ragionamento:</strong> ${q.why}</p><div class="field"><label for="explain">La tua spiegazione, se vuoi scriverla</label><textarea id="explain" placeholder="Puoi anche rispondere a voce.">${esc(state.notes[key]||'')}</textarea></div></div><div class="actions"><button id="other-q">${state.q===0?'Un’altra prova →':'← Torna alla prima prova'}</button><button id="solution-button" ${rec.attempts<2&&!rec.correct?'hidden':''}>Mostra la soluzione</button></div><p id="attempt-note" class="small muted"></p>`;
 const status=()=>{$('attempt-note').textContent=`${rec.attempts?'Tentativi: '+rec.attempts+'. ':''}${rec.help?'Indizio aperto. ':''}${rec.model?'Esempio o soluzione consultati. ':''}${rec.first===true?'Prima risposta corretta'+(rec.firstHelp?' dopo un aiuto.':' prima degli aiuti.'):rec.first===false?'Prima risposta da rivedere.':''}`;};status();
 $('lesson-content').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{rec.value=readAnswer(q,'answer');}));
 $('explain').addEventListener('input',()=>{state.notes[key]=$('explain').value;});
 $('check').addEventListener('click',()=>{
  const value=readAnswer(q,'answer');if(value===''||(!q.options&&!Number.isFinite(parse(value)))){$('feedback').className='feedback';$('feedback').textContent='Inserisci una risposta valida prima di controllare.';return;}
  const ok=correct(q,value);rec.value=value;rec.attempts++;if(rec.first===null){rec.first=ok;rec.firstHelp=rec.help||rec.model;}rec.correct=ok;
  $('feedback').className='feedback'+(ok?' good':'');$('feedback').textContent=ok?`Corretto. ${q.solution}`:'La risposta non torna ancora. Controlla il valore delle cifre, l’operazione e l’unità; puoi aprire un indizio e riprovare.';
  $('solution-button').hidden=!(rec.attempts>=2||ok);status();nav();
 });
 $('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click();});
 $('hint').addEventListener('click',()=>{rec.help=true;$('hint-box').hidden=false;$('hint-box').textContent=q.hint;status();});
 $('model').addEventListener('click',()=>{rec.model=true;state.stage='example';renderLesson();});
 $('solution-button').addEventListener('click',()=>{rec.model=true;$('solution').hidden=false;$('solution').textContent=q.solution;status();});
 $('other-q').addEventListener('click',()=>{rec.value=readAnswer(q,'answer');state.q=1-state.q;renderPractice();$('lesson-content').focus();});
}

  const update=()=>{const n=Number($('tenths').value);$('tenths-value').textContent=n;$('decimal-bars').innerHTML=svg(Array.from({length:10},(_,i)=>`<rect x="${20+i*32}" y="25" width="32" height="55" fill="${i<n?'#126958':'#fff'}" stroke="#60776f"/>`).join('')+text(20,112,'0')+text(330,112,'1'),'Una barra suddivisa in dieci parti uguali: '+n+' parti sono selezionate.','La barra intera vale 1. Ogni blocco vale 0,1.','0 0 360 130');$('decimal-value').textContent=`${n}/10 = ${fmt(n/10)} = ${n*10}/100`;};$('tenths').addEventListener('input',update);update();return;
 }
 if(kind==='powers'){

 if(kind==='conversion'){
  root.innerHTML=`<h3>Esplora una conversione</h3><p class="small">Prevedi se il numero aumenta o diminuisce, poi apri il passaggio.</p><div class="lab-controls"><div class="field"><label for="conversion-value">Lunghezza</label><input id="conversion-value" value="25" inputmode="decimal"></div><div class="field"><label for="conversion-from">Unità iniziale</label><select id="conversion-from"><option value="cm">cm</option><option value="mm">mm</option><option value="dm">dm</option><option value="m">m</option><option value="km">km</option></select></div><div class="field"><label for="conversion-to">Nuova unità</label><select id="conversion-to"><option value="m">m</option><option value="mm">mm</option><option value="cm">cm</option><option value="dm">dm</option><option value="km">km</option></select></div></div><button id="conversion-check">Mostra il passaggio</button><div id="conversion-result" class="feedback" role="status"></div>`;

 }
 if(kind==='volume'){root.innerHTML=`<div class="visual-pair">${svg(`<g transform="translate(70 35)"><rect width="150" height="100" fill="#e6efeb" stroke="#126958" stroke-width="2"/>${Array.from({length:4},(_,i)=>`<path d="M${i*50} 0v100" stroke="#126958"/>`).join('')}<path d="M0 50h150" stroke="#126958"/>${text(-58,58,'2 cm')}${text(48,127,'3 cm')}</g>`, 'Rettangolo di tre per due centimetri, suddiviso in sei quadrati da un centimetro quadrato.','Area: 3 × 2 = 6 cm².','0 0 330 185')}${svg(`<g transform="translate(60 65)"><path d="M0 0h150v100H0z" fill="#dae8ef" stroke="#235cad" stroke-width="2"/><path d="M0 0l50-40h150l-50 40z" fill="#eaf2ff" stroke="#235cad" stroke-width="2"/><path d="M150 0l50-40v100l-50 40z" fill="#b9cfdd" stroke="#235cad" stroke-width="2"/><path d="M50 0v100 M100 0v100 M0 50h150 M50 0l50-40 M100 0l50-40 M150 50l50-40" stroke="#235cad"/>${text(47,127,'3 cm')}${text(-58,58,'2 cm')}${text(160,-10,'1 cm')}</g>`, 'Blocco di tre per due per un centimetro, rappresentato con sei cubetti.','Volume: 3 × 2 × 1 = 6 cm³. Schema in prospettiva, non in scala.','0 0 330 215')}</div>`;return;}

  $('density-check').addEventListener('click',()=>{const m=parse($('mass').value),v=parse($('vol').value),r=$('density-result');if(!Number.isFinite(m)||!Number.isFinite(v)||m<=0||v<=0||m>1e9||v>1e9){r.className='feedback';r.textContent='Per questo corpo inserisci massa e volume maggiori di zero e non superiori a 1 000 000 000.';return;}r.className='feedback good';r.textContent=`d = ${fmt(m)} g ÷ ${fmt(v)} cm³ = ${fmt(m/v)} g/cm³. Per ogni cm³ la massa è ${fmt(m/v)} g. In unità SI: ${fmt(m/v*1000)} kg/m³.`;});['mass','vol'].forEach(id=>$(id).addEventListener('input',()=>{$('density-result').textContent='Dati cambiati: fai una nuova previsione e ricalcola.';$('density-result').className='feedback';}));
 }

function renderExam(){
 $('main').innerHTML=`<p class="eyebrow">Ricostruisci senza un esempio davanti</p><h1>Un caso nuovo</h1><p class="muted">Leggi i dati, scegli la procedura e scrivi il risultato. Non ci sono indizi in questa pagina: puoi tornare alle lezioni, ma annota il supporto usato.</p><form id="exam-form">${exam.map((d,i)=>`<article class="card section"><h2 style="font-size:1.25rem">${i+1}. ${d.q.prompt}</h2>${answerMarkup(d.q,'exam-'+i,'exam-'+i,state.exam[i]?.value??'')}<div class="field section"><label for="exam-why-${i}">Spiega la scelta dell’operazione o della scrittura</label><textarea id="exam-why-${i}">${esc(state.exam[i]?.why||'')}</textarea></div></article>`).join('')}<div class="field section"><label for="exam-support">Eventuali supporti usati (oppure «nessuno»)</label><input id="exam-support" value="${esc(state.notes['exam-support']||'')}"></div><div class="actions"><button type="submit" class="primary">Consegna e controlla le risposte</button></div></form><section id="exam-result" class="section" role="status" aria-live="polite"></section>${footer()}`;
 const save=()=>{exam.forEach((d,i)=>{state.exam[i]={value:readAnswer(d.q,'exam-'+i),why:$('exam-why-'+i).value};});state.notes['exam-support']=$('exam-support').value;};$('exam-form').addEventListener('input',save);
 $('exam-form').addEventListener('submit',e=>{e.preventDefault();save();$('exam-result').innerHTML=`<h2>Confronta i ragionamenti</h2><p class="muted">Le spiegazioni scritte non vengono valutate automaticamente. Confrontale con i passaggi e discutile con il docente o un compagno.</p>`+exam.map((d,i)=>`<article class="result-item"><strong>${i+1} · ${correct(d.q,state.exam[i].value)?'Risultato corretto':'Risultato da rivedere'}</strong><p>${d.q.solution}</p><button data-lesson="${d.lesson}">Riprendi: ${lessons[d.lesson].title}</button></article>`).join('');bindRoutes();$('exam-result').scrollIntoView({block:'start'});});
}
function renderGlossary(){
 $('main').innerHTML=`<p class="eyebrow">Da consultare quando serve</p><h1>Parole e simboli</h1>${table('Il lessico delle prime lezioni',['Parola','Significato'],[['Grandezza','Una proprietà misurabile: per esempio lunghezza, massa, tempo.'],['Unità','Una quantità scelta come riferimento per esprimere una grandezza.'],['Strumento','Il dispositivo con cui misuri: righello, bilancia, cronometro.'],['Protocollo','La procedura che dice come eseguire e comunicare la misura.'],['Decimo','Una delle dieci parti uguali di un intero: 1/10 = 0,1.'],['Centesimo','Una delle cento parti uguali: 1/100 = 0,01.'],['Esponente','Il numero che indica la potenza. Un esponente negativo indica un reciproco.'],['Coefficiente','Il fattore a nella scrittura a × 10ⁿ.'],['Rapporto','Il risultato di una divisione tra due quantità.'],['Incognita','La grandezza da trovare in un problema.'],['Densità','Il rapporto tra massa e volume: quanta massa per unità di volume.'],['=','Uguaglianza: due scritture hanno lo stesso valore.'],['≈','Approssimazione: il valore è una stima, con una precisione o regola dichiarata.'],['&lt; / &gt;','Minore di / maggiore di.'],['² / ³','Al quadrato / al cubo: due o tre fattori uguali.']])}<section class="card section"><h2 style="font-size:1.4rem">Fonti e ambito</h2><p class="small">Il percorso riprende i materiali della classe del 30 settembre e 2 ottobre 2026, integrando i prerequisiti e correggendo formulazioni ambigue. Esempi e dati nuovi sono didattici.</p><ul class="small"><li><a href="https://www.nist.gov/pml/owm/metric-si-prefixes" target="_blank" rel="noopener">NIST · Prefissi SI</a></li><li><a href="https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-4-two-classes-si-units-and-si-prefixes" target="_blank" rel="noopener">NIST · Unità fondamentali e derivate</a></li><li><a href="https://openstax.org/books/physics/pages/1-3-the-language-of-physics-physical-quantities-and-units" target="_blank" rel="noopener">OpenStax · Grandezze e unità</a></li><li><a href="https://openstax.org/books/college-physics/pages/1-3-accuracy-precision-and-significant-figures" target="_blank" rel="noopener">OpenStax · Precisione e incertezza</a></li></ul><p class="small">La densità è trattata per corpi con massa e volume positivi. L’ordine di grandezza usa esplicitamente la soglia 5 del report di classe.</p></section>${footer()}`;
}
$('home-button').addEventListener('click',()=>show('home'));
$('menu').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open));});
$('large').addEventListener('click',()=>{const on=document.body.classList.toggle('text-large');$('large').setAttribute('aria-pressed',String(on));});
$('focus').addEventListener('click',()=>{const on=document.body.classList.toggle('focus');$('focus').setAttribute('aria-pressed',String(on));$('focus').textContent=on?'Mostra il percorso':'Una cosa alla volta';});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.print-value').forEach(el=>el.remove());document.querySelectorAll('textarea').forEach(el=>{const copy=document.createElement('div');copy.className='print-only print-value';copy.textContent=el.value||'Spazio per gli appunti';el.after(copy);});});
window.addEventListener('afterprint',()=>{document.querySelectorAll('.print-value').forEach(el=>el.remove());});
show('home',false);
})();
